<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>待办</title>
<style>
  /* Mirrors Python DesktopTodoWidget (todo_widget.py) */
  :root {
    --card: rgba(255,255,255,0.88);
    --title: rgba(224,231,255,0.82);
    --hover: rgba(224,231,255,0.55);
    --border: rgba(201,210,222,0.55);
    --text: #1A2332;
    --muted: #64748B;
    --accent: #1D4ED8;
    --danger: #B91C1C;
    --danger-bg: rgba(254,226,226,0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px; user-select: none;
  }
  #card {
    height: 100%; display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #title {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 8px 8px 12px;
    background: var(--title);
    cursor: move;
    border-bottom: 1px solid var(--border);
  }
  #heading {
    font-weight: 700; font-size: 11pt; flex: 1; color: var(--text);
    background: transparent;
  }
  #count {
    color: var(--muted); font-size: 11px; background: transparent;
  }
  #hide {
    width: 24px; height: 24px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 16px;
    font-weight: 700; cursor: pointer;
  }
  #hide:hover { background: var(--hover); color: var(--text); }
  #list {
    flex: 1; overflow: auto; padding: 4px 6px;
    max-height: 320px;
  }
  .row {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 4px 4px 4px 8px; border-radius: 8px;
  }
  .row:hover { background: var(--hover); }
  .row input[type=checkbox] { margin-top: 4px; accent-color: var(--accent); }
  .row input[type=text] {
    flex: 1; min-width: 0; border: 0; background: transparent;
    font: inherit; font-size: 13px; color: var(--text);
    outline: none; padding: 2px 0;
  }
  .row.done input[type=text] {
    color: var(--muted); text-decoration: line-through;
  }
  .row .del {
    width: 22px; height: 22px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: 14px; font-weight: 700;
  }
  .row .del:hover { background: var(--danger-bg); color: var(--danger); }
  #empty {
    color: var(--muted); text-align: center; padding: 28px 8px; font-size: 13px;
  }
  #add {
    border: 0; border-top: 1px solid var(--border);
    background: transparent; color: var(--accent);
    border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
    padding: 8px 12px; min-height: 34px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: left; width: 100%;
  }
  #add:hover { background: var(--hover); }
</style>
</head>
<body>
<div id="card">
  <div id="title">
    <div id="heading">待办</div>
    <div id="count"></div>
    <button id="hide" title="暂时隐藏">−</button>
  </div>
  <div id="list"></div>
  <button id="add">+ 添加待办事项</button>
</div>
<script>
  let items = [];
  let dragging = false;

  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function hexToRgba(hex, a) {
    const h = String(hex || '').replace('#', '');
    if (h.length < 6) return hex;
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function applyTheme(t) {
    if (!t || typeof t !== 'object') return;
    const root = document.documentElement.style;
    if (t.card) root.setProperty('--card', hexToRgba(t.card, 0.88));
    if (t.accent_soft) {
      root.setProperty('--title', hexToRgba(t.accent_soft, 0.82));
      root.setProperty('--hover', hexToRgba(t.accent_soft, 0.55));
    }
    if (t.border) root.setProperty('--border', hexToRgba(t.border, 0.55));
    if (t.text) root.setProperty('--text', t.text);
    if (t.muted) root.setProperty('--muted', t.muted);
    if (t.accent) root.setProperty('--accent', t.accent);
  }
  function render() {
    const list = document.getElementById('list');
    const pending = items.filter(it => !it.done);
    const done = items.filter(it => it.done);
    const ordered = pending.concat(done);
    const openN = pending.length;
    document.getElementById('count').textContent = openN ? (openN + ' 项') : '';
    document.getElementById('add').textContent =
      ordered.length ? '+ 添加待办事项' : '+ 添加第一条待办';
    if (!ordered.length) {
      list.innerHTML = '<div id="empty">暂无待办</div>';
      return;
    }
    list.innerHTML = ordered.map((it) => {
      const i = items.indexOf(it);
      return `<div class="row${it.done ? ' done' : ''}" data-i="${i}">
        <input type="checkbox" ${it.done ? 'checked' : ''} data-act="toggle" />
        <input type="text" value="${esc(it.text)}" data-act="edit" placeholder="输入待办…" />
        <button class="del" data-act="del" title="删除">×</button>
      </div>`;
    }).join('');
    list.querySelectorAll('.row').forEach(row => {
      const i = +row.dataset.i;
      row.querySelector('[data-act=toggle]').onchange = e => {
        post({ type: 'action', id: 'toggle', index: i, done: !!e.target.checked });
      };
      const edit = row.querySelector('[data-act=edit]');
      edit.onchange = () => post({ type: 'action', id: 'edit', index: i, text: edit.value });
      edit.onkeydown = e => {
        if (e.key === 'Enter') { edit.blur(); }
      };
      row.querySelector('[data-act=del]').onclick = () =>
        post({ type: 'action', id: 'del', index: i });
    });
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('heading').textContent = m.title;
    if (m.theme) applyTheme(m.theme);
    items = Array.isArray(m.items) ? m.items.slice() : [];
    render();
  };
  document.getElementById('add').onclick = () => post({ type: 'action', id: 'add' });
  document.getElementById('hide').onclick = () => post({ type: 'action', id: 'hide' });
  document.getElementById('title').onmousedown = e => {
    if (e.target.id === 'hide') return;
    dragging = true;
    post({ type: 'action', id: 'drag_start', x: e.screenX, y: e.screenY });
  };
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; post({ type: 'action', id: 'drag_end' }); }
  });
  window.addEventListener('mousemove', e => {
    if (dragging) post({ type: 'action', id: 'drag_move', x: e.screenX, y: e.screenY });
  });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
