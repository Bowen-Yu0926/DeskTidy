<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>待办</title>
<style>
  :root {
    --card: rgba(255,255,255,0.90); --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #16A34A; --danger: #DC2626; --title: rgba(224,231,255,0.88);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px; user-select: none;
  }
  #card {
    height: 100%; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: 0 10px 28px rgba(26,35,50,0.14);
  }
  #title {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 8px 12px; background: var(--title); cursor: move;
    border-bottom: 1px solid var(--border);
  }
  #title .t { font-weight: 800; flex: 1; color: #1E3A8A; }
  #hide {
    width: 26px; height: 26px; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted); font-size: 16px; cursor: pointer;
  }
  #hide:hover { background: var(--accent-soft); color: var(--accent); }
  #list { flex: 1; overflow: auto; padding: 8px 10px; }
  .row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 8px; margin-bottom: 4px;
  }
  .row:hover { background: var(--accent-soft); }
  .row input[type=checkbox] { margin-top: 6px; accent-color: var(--accent); }
  .row input[type=text] {
    flex: 1; min-width: 0; border: 0; background: transparent; font: inherit;
    color: var(--text); outline: none; padding: 4px 0;
  }
  .row.done input[type=text] { color: var(--muted); text-decoration: line-through; }
  .row .del {
    width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent;
    color: var(--muted); cursor: pointer; font-weight: 800;
  }
  .row .del:hover { background: #FEE2E2; color: var(--danger); }
  #empty { color: var(--muted); text-align: center; padding: 36px 8px; }
  .foot {
    display: flex; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid var(--border);
  }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 6px 10px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { filter: brightness(0.95); color: #fff; }
</style>
</head>
<body>
<div id="card">
  <div id="title">
    <div class="t" id="heading">待办</div>
    <button id="hide">−</button>
  </div>
  <div id="list"></div>
  <div class="foot">
    <button class="btn primary" id="add">添加</button>
    <button class="btn" id="clear">清除已完成</button>
  </div>
</div>
<script>
  let items = [];
  let dragging = false;

  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">暂无待办</div>';
      return;
    }
    list.innerHTML = items.map((it, i) =>
      `<div class="row${it.done?' done':''}" data-i="${i}">
        <input type="checkbox" ${it.done?'checked':''} data-act="toggle" />
        <input type="text" value="${esc(it.text)}" data-act="edit" />
        <button class="del" data-act="del" title="删除">×</button>
      </div>`).join('');
    list.querySelectorAll('.row').forEach(row => {
      const i = +row.dataset.i;
      row.querySelector('[data-act=toggle]').onchange = e => {
        post({ type: 'action', id: 'toggle', index: i, done: !!e.target.checked });
      };
      const edit = row.querySelector('[data-act=edit]');
      edit.onchange = () => post({ type: 'action', id: 'edit', index: i, text: edit.value });
      edit.onkeydown = e => {
        if (e.key === 'Enter') { edit.blur(); }
      };
      row.querySelector('[data-act=del]').onclick = () => post({ type: 'action', id: 'del', index: i });
    });
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('heading').textContent = m.title;
    items = Array.isArray(m.items) ? m.items.slice() : [];
    render();
  };
  document.getElementById('add').onclick = () => post({ type: 'action', id: 'add' });
  document.getElementById('clear').onclick = () => post({ type: 'action', id: 'clear' });
  document.getElementById('hide').onclick = () => post({ type: 'action', id: 'hide' });
  document.getElementById('title').onmousedown = e => {
    if (e.target.id === 'hide') return;
    dragging = true;
    post({ type: 'action', id: 'drag_start', x: e.screenX, y: e.screenY });
  };
  window.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; post({ type: 'action', id: 'drag_end' }); }
  });
  window.addEventListener('mousemove', e => {
    if (dragging) post({ type: 'action', id: 'drag_move', x: e.screenX, y: e.screenY });
  });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
