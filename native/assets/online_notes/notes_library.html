<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>笔记库</title>
<style>
  :root {
    --card: #FFFFFF;
    --border: rgba(15, 23, 42, 0.10);
    --text: #172033;
    --muted: #66788C;
    --accent: #2F6FED;
    --accent-soft: #EAF1FE;
    --row-hover: rgba(234, 241, 254, 0.5);
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: #f5f6f8; color: var(--text); font-size: 13px;
    overflow: hidden; user-select: none;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; position: relative; }
  #list {
    flex: 1; min-height: 0; overflow: auto; padding: 6px 8px 12px;
  }
  .sec {
    padding: 8px 6px 4px; font-size: 11px; font-weight: 700;
    color: #1d4ed8; letter-spacing: 0.04em;
  }
  .sec.local { color: #475569; }
  .hint {
    color: var(--muted); font-size: 12px; padding: 8px 6px 12px; line-height: 1.45;
  }
  .hint a {
    color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer;
  }
  #empty { color: var(--muted); text-align: center; padding: 28px 10px; }
  .row {
    position: relative;
    background: linear-gradient(90deg, #dbeafe 0 4px, var(--card) 4px);
    border: 1px solid #bfdbfe; border-radius: 10px;
    padding: 10px 58px 10px 12px; margin-bottom: 8px; cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .row.local {
    background: linear-gradient(90deg, #cbd5e1 0 4px, var(--card) 4px);
    border-color: #e2e8f0;
  }
  .row:hover {
    background: linear-gradient(90deg, #93c5fd 0 4px, var(--row-hover) 4px);
    border-color: var(--accent);
  }
  .row.local:hover {
    background: linear-gradient(90deg, #94a3b8 0 4px, var(--row-hover) 4px);
    border-color: #64748b;
  }
  .row.on {
    border-color: var(--accent);
    background: linear-gradient(90deg, #2F6FED 0 4px, var(--accent-soft) 4px);
  }
  .match-hl {
    background-color: #ffe066;
    color: #172033;
    font-weight: 700;
    border-radius: 2px;
    padding: 0 2px;
    box-shadow: 0 0 0 1px rgba(234, 179, 8, 0.35);
  }
  .row.on .match-hl {
    background-color: #facc15;
    color: #0f172a;
    box-shadow: 0 0 0 1px rgba(202, 138, 4, 0.45);
  }
  .row-title {
    display: flex; align-items: center;
    font-weight: 600; min-width: 0;
  }
  .row-title-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* Cloud vs local must be obvious at a glance: cloud rows carry a filled
     accent badge + left color bar; local rows carry a muted outline badge. */
  .cloud-icon {
    position: absolute; top: 9px; right: 30px;
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
    box-shadow: 0 1px 2px rgba(47, 111, 237, 0.35);
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .cloud-icon svg {
    width: 14px; height: 14px; display: block;
  }
  .row.local .cloud-icon {
    background: transparent; color: #8b96a8;
    box-shadow: none; opacity: 0.5;
    border: 1px solid rgba(139, 150, 168, 0.45);
  }
  .row.local:hover .cloud-icon,
  .row.local.on .cloud-icon {
    opacity: 0.85;
  }
  .cloud-icon:hover {
    transform: scale(1.08);
  }
  .row.local .cloud-icon:hover {
    color: var(--accent) !important;
    border-color: var(--accent) !important;
    background: rgba(47, 111, 237, 0.10) !important;
    opacity: 1 !important;
  }
  /* Left bar makes the state readable without hovering or reading the badge. */
  .row::before {
    content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
    width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
  }
  .row.local::before {
    background: rgba(139, 150, 168, 0.45);
  }
  .row-meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
  /* Drag-to-reorder feedback. The whole row is the drag handle; the ghost
     fades and a thin rule shows where it will land. */
  .row[draggable="true"] { cursor: grab; }
  .row.dragging { opacity: .45; }
  .row.dragging .cloud-icon, .row.dragging .more { pointer-events: none; }
  .more {
    position: absolute; top: 6px; right: 4px;
    width: 26px; height: 26px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 16px; line-height: 1;
    cursor: pointer; letter-spacing: 1px;
  }
  .more:hover { background: rgba(15, 23, 42, 0.06); color: var(--text); }
  #menu-backdrop {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 18; background: transparent;
  }
  #menu {
    display: none; position: fixed; z-index: 20; min-width: 148px;
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12); padding: 4px;
  }
  #menu button {
    display: block; width: 100%; text-align: left; border: 0; background: transparent;
    font: inherit; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--text);
  }
  #menu button:hover { background: var(--accent-soft); }
  #menu button.danger { color: #b91c1c; }
  #menu button.danger:hover { background: #fef2f2; }
  #menu .menu-title {
    padding: 6px 10px 2px; font-size: 11px; font-weight: 700; color: var(--muted);
  }
  #menu .menu-sub {
    padding-left: 18px; font-size: 12px;
  }
  #menu .sep {
    height: 1px; background: var(--border); margin: 4px 6px;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="list"><div id="empty">（笔记库为空）</div></div>
</div>
<div id="menu-backdrop"></div>
<div id="menu"></div>
<script>
  const state = {
    query: '',
    active: '',
    logged_in: false,
    local_matched: false,
    online: [],
    local: [],
    saved_order: null
  };
  let menuCtx = null;
  let menuOpen = false;

  function post(obj) {
    try {
      if (window.chrome && window.chrome.webview) {
        chrome.webview.postMessage(JSON.stringify(obj));
      }
    } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function normKey(k) {
    if (!k) return '';
    return String(k).trim().replace(/\\/g, '/').toLowerCase();
  }
  function isKeyActive(key) {
    if (!key || !state.active) return false;
    return normKey(key) === normKey(state.active);
  }
  function highlightMatches(text, query) {
    if (!text) return '';
    const str = String(text);
    if (!query || !query.trim()) {
      return esc(str);
    }
    const q = query.trim();
    // 收集所有词项：完整短语、空格分词，以及单个字符（保证拼音或子序列命中也能将匹配的文字标出）
    const rawTokens = [q, ...q.split(/\s+/)].filter((t) => t.length > 0);
    // 当查询字符多于1个且匹配不到整体时，分拆出字符进行单字高亮
    if (q.length > 1) {
      for (let i = 0; i < q.length; i++) {
        const ch = q[i].trim();
        if (ch) rawTokens.push(ch);
      }
    }
    const tokens = Array.from(new Set(rawTokens));
    // 长的在前，优先匹配更长的子串
    tokens.sort((a, b) => b.length - a.length);
    const escaped = tokens.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    if (!escaped.length) return esc(str);

    const regex = new RegExp('(' + escaped.join('|') + ')', 'gi');
    const parts = str.split(regex);
    return parts.map((part) => {
      if (!part) return '';
      const isMatch = tokens.some((t) => t.toLowerCase() === part.toLowerCase());
      return isMatch ? ('<mark class="match-hl">' + esc(part) + '</mark>') : esc(part);
    }).join('');
  }
  function matchKeywords(title, q) {
    if (!q) return true;
    const t = String(title || '').toLowerCase();
    if (t.indexOf(q) >= 0) return true;
    const words = q.split(/\s+/).filter(Boolean);
    if (words.length > 1 && words.every((w) => t.indexOf(w) >= 0)) return true;
    let idx = 0;
    for (let i = 0; i < t.length && idx < q.length; i++) {
      if (t[i] === q[idx]) idx++;
    }
    return idx === q.length;
  }
  function matchTitle(it) {
    const q = (state.query || '').trim().toLowerCase();
    if (!q) return true;
    // Local & synced rows arrive already full-text matched by the host; skip the
    // title-only second pass so body hits are not dropped here.
    if ((it.kind === 'local' || it.kind === 'synced') && state.local_matched) return true;
    return matchKeywords(it.title, q);
  }
  function rowKind(it, fallback) {
    return (it && it.kind) ? it.kind : fallback;
  }
  function hideMenu() {
    const m = document.getElementById('menu');
    const backdrop = document.getElementById('menu-backdrop');
    if (m) {
      m.style.display = 'none';
      m.innerHTML = '';
    }
    if (backdrop) {
      backdrop.style.display = 'none';
    }
    menuCtx = null;
    menuOpen = false;
  }
  window.hideMenu = hideMenu;
  function showMenuAt(x, y, it, kind) {
    const m = document.getElementById('menu');
    menuCtx = { it, kind };
    const hasPath = !!(it && it.path);
    const pinned = !!(it && (it.pinned === true || it.pinned === 'true'));
    const locked = !!(it && (it.locked === true || it.locked === 'true'));
    let html = '';
    if (kind === 'local') {
      html += '<button type="button" data-act="to_cloud">转云</button>';
    } else if (kind === 'synced' || kind === 'online') {
      html += '<button type="button" data-act="to_local">转本地</button>';
    }
    if (html) html += '<div class="sep"></div>';
    html += '<div class="menu-title">导出为</div>';
    html += '<button type="button" class="menu-sub" data-act="export_docx">Word 文档 (*.docx)</button>';
    html += '<button type="button" class="menu-sub" data-act="export_pdf">PDF 文档 (*.pdf)</button>';
    html += '<button type="button" class="menu-sub" data-act="export_md">Markdown (*.md 含图片)</button>';
    html += '<button type="button" class="menu-sub" data-act="export_html">单文件网页 (*.html)</button>';
    html += '<div class="sep"></div>';
    html += '<button type="button" data-act="pin">' +
      (pinned ? '取消置顶' : '置顶') + '</button>';
    html += '<button type="button" data-act="lock">' +
      (locked ? '解锁' : '锁定') + '</button>';
    html += '<button type="button" data-act="rename">重命名</button>';
    if (!locked) {
      html += '<button type="button" class="danger" data-act="delete">删除</button>';
    }
    if (hasPath) {
      html += '<div class="sep"></div>';
      html += '<button type="button" data-act="reveal">在资源管理器中显示</button>';
    }
    if (!html) {
      hideMenu();
      return;
    }
    const backdrop = document.getElementById('menu-backdrop');
    if (backdrop) {
      backdrop.style.display = 'block';
    }
    m.innerHTML = html;
    m.style.display = 'block';
    menuOpen = true;
    const mw = m.offsetWidth || 148;
    const mh = m.offsetHeight || 40;
    let left = x;
    let top = y;
    if (left + mw > window.innerWidth - 4) left = Math.max(4, window.innerWidth - mw - 4);
    if (left < 4) left = 4;
    if (top + mh > window.innerHeight - 4) top = Math.max(4, y - mh - 2);
    if (top < 4) top = 4;
    m.style.left = left + 'px';
    m.style.top = top + 'px';
    m.querySelectorAll('button').forEach((btn) => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const act = btn.getAttribute('data-act');
        const fallbackPath = (it && it.id && kind === 'online') ? ('online://' + it.id) : '';
        const payload = {
          type: 'action',
          id: act,
          path: (it && it.path) || fallbackPath,
          note_id: Number((it && it.id) || 0),
          title: (it && it.title) || ''
        };
        post(payload);
        hideMenu();
      };
    });
  }
  function showMenuNear(el, it, kind) {
    const r = el.getBoundingClientRect();
    showMenuAt(r.right - 8, r.bottom + 2, it, kind);
  }
  const CLOUD_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.5 19a4.5 4.5 0 0 1-.36-8.99 6 6 0 0 1 11.66-.53A4 4 0 0 1 17.5 19h-11Z"/></svg>';
  const FILE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>';
  function rowHtml(it, fallbackKind) {
    const kind = rowKind(it, fallbackKind);
    const key = (kind === 'online' && !it.path)
      ? ('online://' + it.id)
      : String(it.path || '');
    const on = isKeyActive(key) ? ' on' : '';
    const cloud = kind === 'online' || kind === 'synced';
    const showCloud = cloud;
    const cls = showCloud ? 'row' : 'row local';
    let rawMeta = '';
    if (it.folder) {
      rawMeta = it.folder;
    } else if (cloud) {
      rawMeta = it.updated_at || '已同步';
    } else {
      rawMeta = '本地库';
    }
    let data = 'data-kind="' + esc(kind) + '"';
    if (it.path) data += ' data-path="' + esc(it.path) + '"';
    if (it.title) data += ' data-title="' + esc(it.title) + '"';
    if (it.line != null && it.line >= 0) data += ' data-line="' + Number(it.line) + '"';
    if (it.id) data += ' data-id="' + esc(it.id) + '"';
    if (it.pinned) data += ' data-pinned="1"';
    if (it.locked) data += ' data-locked="1"';
    const more = '<button type="button" class="more" title="更多">⋯</button>';
    const cloudTip = cloud
      ? '☁ 已云同步 — 点击转为本机文件'
      : '本机文件 — 点击转为云同步';
    const cloudBadge =
      '<button type="button" class="cloud-icon" title="' + cloudTip +
      '" aria-label="' + cloudTip + '">' +
      (cloud ? CLOUD_SVG : FILE_SVG) + '</button>';

    const titleHtml = highlightMatches(it.title || '未命名', state.query);
    const metaHtml = highlightMatches(rawMeta, state.query);

    return '<div class="' + cls + on + '" ' + data + ' draggable="true">'
      + cloudBadge
      + more
      + '<div class="row-title"><span class="row-title-text">' + titleHtml + '</span></div>'
      + '<div class="row-meta">' + metaHtml + '</div></div>';
  }
  function bindRow(el) {
    const kind = el.dataset.kind || 'local';
    const it = {
      kind,
      path: el.dataset.path || '',
      id: el.dataset.id || 0,
      line: (el.dataset.line != null && el.dataset.line !== '') ? Number(el.dataset.line) : -1,
      title: el.dataset.title || '',
      pinned: el.dataset.pinned === '1',
      locked: el.dataset.locked === '1'
    };
    el.onclick = () => {
      // 立即触发前端选中态，消除 IPC 延迟感
      const myKey = it.path || (kind === 'online' ? ('online://' + it.id) : '');
      state.active = myKey;
      document.querySelectorAll('.row').forEach((r) => {
        const rPath = r.dataset.path || '';
        const rId = r.dataset.id || '';
        const rKind = r.dataset.kind || '';
        const rKey = (rKind === 'online' && !rPath) ? ('online://' + rId) : rPath;
        if (normKey(rKey) === normKey(myKey)) {
          r.classList.add('on');
        } else {
          r.classList.remove('on');
        }
      });

      if (kind === 'online' && !it.path) {
        post({ type: 'action', id: 'open_online', note_id: Number(it.id) });
      } else if (it.path) {
        const payload = { type: 'action', id: 'open_local', path: it.path };
        if (it.line >= 0) payload.line = it.line;
        post(payload);
      }
    };
    el.oncontextmenu = (e) => {
      e.preventDefault();
      e.stopPropagation();
      showMenuAt(e.clientX, e.clientY, it, kind);
    };
    const more = el.querySelector('.more');
    if (more) {
      more.onclick = (e) => {
        e.stopPropagation();
        showMenuNear(more, it, kind);
      };
    }
    const cloudBtn = el.querySelector('.cloud-icon');
    if (cloudBtn) {
      cloudBtn.onclick = (e) => {
        e.stopPropagation();
        const act = (kind === 'online' || kind === 'synced') ? 'to_local' : 'to_cloud';
        post({
          type: 'action',
          id: act,
          path: it.path || '',
          note_id: Number(it.id || 0)
        });
      };
    }
  }
  // --- drag to reorder -------------------------------------------------------
  // The visible note list is this WebView, not the (hidden) Win32 TreeView, so
  // ordering lives here. Order is stored per section ("online" / "local") as a
  // list of row keys and kept in localStorage; unlisted rows fall back to the
  // original order, so a new note never disappears.
  var ORDER_PREFIX = 'libOrder.';
  function orderKey(section) { return ORDER_PREFIX + section; }
  function loadOrder(section) {
    try {
      var raw = localStorage.getItem(orderKey(section));
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveOrder(section, keys) {
    try { localStorage.setItem(orderKey(section), JSON.stringify(keys)); } catch (e) {}
  }
  function rowKeyOf(el) {
    var p = el.dataset.path || '';
    var id = el.dataset.id || '';
    var kind = el.dataset.kind || '';
    return normKey((kind === 'online' && !p) ? ('online://' + id) : p);
  }
  // Stable sort: rows named in `order` come first in that exact order.
  function applyOrder(items, section) {
    // Prefer this page's own persisted order; fall back to the order the host
    // saved to disk (notes_sidebar_order.json) so a fresh WebView profile that
    // lost its localStorage still restores the user's arrangement.
    var order = loadOrder(section);
    if (!order.length && state.saved_order) {
      var so = state.saved_order[section];
      if (Array.isArray(so)) order = so;
    }
    if (!order.length) return items;
    var rank = {};
    // `order` is stored already-normalised (see commitOrder -> rowKeyOf), but
    // normalise again defensively so an older entry with backslashes still maps.
    for (var i = 0; i < order.length; i++) rank[normKey(order[i])] = i;
    return items.slice().sort(function (a, b) {
      var ka = normKey((rowKind(a, section) === 'online' && !a.path) ? ('online://' + a.id) : String(a.path || ''));
      var kb = normKey((rowKind(b, section) === 'online' && !b.path) ? ('online://' + b.id) : String(b.path || ''));
      var ra = (ka in rank) ? rank[ka] : 1e9;
      var rb = (kb in rank) ? rank[kb] : 1e9;
      if (ra !== rb) return ra - rb;
      return 0;  // keep original order for unlisted rows
    });
  }

  var dragEl = null;
  function sectionOf(el) {
    var k = el.dataset.kind || 'local';
    return (k === 'online' || k === 'synced') ? 'online' : 'local';
  }
  function bindDrag(el) {
    el.addEventListener('dragstart', function (e) {
      dragEl = el;
      el.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', rowKeyOf(el)); } catch (_) {}
      e.dataTransfer.effectAllowed = 'move';
      // No stopPropagation: the row also has a click handler, and swallowing
      // the event here made selection feel unresponsive.
    });
    el.addEventListener('dragend', function () {
      el.classList.remove('dragging');
      // Do NOT clear dragEl here: drop fires before dragend in some engines,
      // and commitOrder still needs it. It is cleared there instead.
    });
    el.addEventListener('dragover', function (e) {
      if (!dragEl || dragEl === el) return;
      // Same section only — moving between 在线/本地 is 转云/转本地, a different
      // operation with its own buttons. Both sections share #list, so compare
      // the derived section rather than parentNode.
      if (sectionOf(dragEl) !== sectionOf(el)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      var r = el.getBoundingClientRect();
      var after = (e.clientY - r.top) > r.height / 2;
      // Skip the move when the row is already where it would land; without
      // this, dragover fires continuously and the row jitters.
      if (after) {
        if (dragEl.nextSibling === el) return;
        el.parentNode.insertBefore(dragEl, el.nextSibling);
      } else {
        if (dragEl.previousSibling === el) return;
        el.parentNode.insertBefore(dragEl, el);
      }
    });
    el.addEventListener('drop', function (e) {
      e.preventDefault();
      e.stopPropagation();
      // dragEl (the row that moved), not el (the row it was dropped on).
      commitOrder(dragEl);
    });
  }
  function commitOrder(draggedEl) {
    if (!draggedEl) return;
    var kind = draggedEl.dataset.kind || 'local';
    var section = (kind === 'online' || kind === 'synced') ? 'online' : 'local';
    // Online and local rows share the same #list container, so collect only
    // the rows of the dragged row's section — otherwise each section's stored
    // order would contain the other section's keys.
    var all = Array.prototype.slice.call(
        document.querySelectorAll('#list .row'));
    var mine = all.filter(function (el) {
      var k = el.dataset.kind || 'local';
      return ((k === 'online' || k === 'synced') ? 'online' : 'local') === section;
    });
    // rowKeyOf already runs normKey, so what is stored is the same form the
    // comparator looks up. Keeping them identical avoids relying on the
    // defensive re-normalisation inside applyOrder.
    saveOrder(section, mine.map(rowKeyOf));
    // Persist the new order to the host as well. The page's own localStorage
    // only lives in this WebView's profile; mirroring it to disk
    // (notes_sidebar_order.json) means the order survives a data wipe and is
    // available to rebuild the rail from the native side.
    post({
      type: 'action',
      id: 'reorder',
      section: section,
      order: mine.map(rowKeyOf)
    });
    dragEl = null;
    render();
  }

  function render() {
    hideMenu();
    const box = document.getElementById('list');
    // Every state push rebuilds the whole list (innerHTML). Preserve the
    // scroll position or the panel jumps to the top on each keystroke of the
    // 280ms-debounced search and on every save-driven refresh.
    const keepScroll = box ? box.scrollTop : 0;
    const online = applyOrder((state.online || []).filter(matchTitle), 'online');
    const local = applyOrder((state.local || []).filter(matchTitle), 'local');
    const hasOnlineBlock = online.length > 0 || state.logged_in;
    let html = '';
    if (!hasOnlineBlock) {
      html += '<div class="hint">未登录云账号 — <a id="login-link">登录后可转云与同步</a></div>';
    } else {
      html += '<div class="sec">在线笔记</div>';
      if (!online.length) {
        html += '<div class="hint">暂无在线笔记；本地文件可通过 ⋯ → 转云</div>';
      } else {
        html += online.map((it) => rowHtml(it, 'online')).join('');
      }
      if (!state.logged_in) {
        html += '<div class="hint"><a id="login-link">登录云账号</a> 后可同步刷新</div>';
      }
    }
    html += '<div class="sec local">本地笔记</div>';
    if (!local.length) {
      html += '<div class="hint">' +
        (state.local_matched
          ? '没有匹配的本地笔记（搜索覆盖文件名与正文）'
          : '暂无本地笔记，点侧栏 + 新建') + '</div>';
    } else {
      html += local.map((it) => rowHtml(it, 'local')).join('');
    }
    box.innerHTML = html;
    if (box && keepScroll > 0) {
      // Clamp: the new content may be shorter than the old scroll offset.
      const maxScroll = Math.max(0, box.scrollHeight - box.clientHeight);
      box.scrollTop = Math.min(keepScroll, maxScroll);
    }
    const login = document.getElementById('login-link');
    if (login) {
      login.onclick = (e) => {
        e.preventDefault();
        post({ type: 'action', id: 'login' });
      };
    }
    box.querySelectorAll('.row').forEach(function (el) {
      bindRow(el);
      bindDrag(el);
    });
  }
  const backdrop = document.getElementById('menu-backdrop');
  if (backdrop) {
    backdrop.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      hideMenu();
    }, true);
    backdrop.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      hideMenu();
    }, true);
  }
  document.addEventListener('pointerdown', (e) => {
    if (menuOpen && !e.target.closest('#menu')) {
      hideMenu();
    }
  }, true);
  document.addEventListener('click', () => {
    if (menuOpen) hideMenu();
  });
  window.addEventListener('blur', () => {
    if (menuOpen) hideMenu();
  });
  document.addEventListener('contextmenu', (e) => {
    // Blank rail / section headers: swallow Chromium menu.
    if (!e.target.closest || !e.target.closest('.row')) {
      e.preventDefault();
      hideMenu();
    }
  });
  // Selection-only update: touching .on classes instead of re-rendering keeps
  // the list from being rebuilt (and scroll reset / hover lost) every time the
  // editor switches tabs.
  window.applyActive = function (key) {
    state.active = key || '';
    window.__lib = state;
    const want = normKey(state.active);
    document.querySelectorAll('#list .row').forEach((r) => {
      const p = r.dataset.path || '';
      const id = r.dataset.id || '';
      const kind = r.dataset.kind || '';
      const k = (kind === 'online' && !p) ? ('online://' + id) : p;
      r.classList.toggle('on', normKey(k) === want);
    });
  };
  // Title-only update: patch the single matching row's label in place instead
  // of rebuilding the whole rail. Typing in a note title used to trigger a full
  // library enumeration + innerHTML rebuild every 200 ms (see host
  // kTitleSyncTimer). Only the title text + data-title are touched here.
  window.patchRowTitle = function (key, title) {
    const want = normKey(key);
    if (!want) return;
    document.querySelectorAll('#list .row').forEach((r) => {
      const p = r.dataset.path || '';
      const id = r.dataset.id || '';
      const kind = r.dataset.kind || '';
      const k = (kind === 'online' && !p) ? ('online://' + id) : p;
      if (normKey(k) !== want) return;
      const span = r.querySelector('.row-title-text');
      if (span) {
        // Mirror render(): keep search highlighting when a query is active,
        // otherwise the row would lose its <mark> while the user types a
        // title during a search.
        span.innerHTML = highlightMatches(title || '未命名', state.query);
      }
      if (title) {
        r.dataset.title = title;
      }
    });
  };
  window.applyState = function (m) {
    if (!m || typeof m !== 'object') return;
    if (m.query != null) state.query = m.query || '';
    if (m.active != null) state.active = m.active || '';
    if (m.logged_in != null) state.logged_in = !!m.logged_in;
    if (m.local_matched != null) state.local_matched = !!m.local_matched;
    if (Array.isArray(m.online)) state.online = m.online;
    if (Array.isArray(m.local)) state.local = m.local;
    // Fallback ordering persisted by the host (notes_sidebar_order.json).
    if (m.saved_order && typeof m.saved_order === 'object') {
      state.saved_order = m.saved_order;
    }
    window.__lib = state;
    render();
  };
  window.__lib = state;
  post({ type: 'ready' });
</script>
</body>
</html>
