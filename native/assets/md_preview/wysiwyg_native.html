<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>deskNote WYSIWYG</title>
  <!-- Milkdown Crepe, pre-bundled to a single file pair (tools/build_crepe.js).
       Self-contained: no network, no CDN, fonts inlined. -->
  <link rel="preload" href="vendor/desknote-editor.js" as="script" />
  <link rel="stylesheet" href="vendor/desknote-editor.css" />
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    body.theme-dark {
      background: #1e1e1e;
      color: #e6e6e6;
    }
    /* Editor surface fills the stage under the native title strip. */
    #editor {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }
    #editor.desknote-body-pending::before {
      content: "";
      display: block;
      height: 10px;
      margin: 18px 18px 0;
      max-width: 42%;
      border-radius: 4px;
      background: #eef1f5;
    }
    body.theme-dark #editor.desknote-body-pending::before {
      background: #2a2a2a;
    }

    /* --- Crepe surface: DingTalk-doc-like typography ---------------------- */
    /* DingTalk online docs are sans-serif throughout, with tighter block
       rhythm and a neutral grey palette. Crepe ships serif titles and very
       loose spacing, so the tokens and the block metrics are overridden here
       instead of restyling every component one by one. */
    #editor .milkdown {
      /* Grow with the document, not just the viewport: the sticky top bar can
         only stay pinned inside a parent box taller than the scrollport. */
      min-height: 100%;
      background: transparent;
      --crepe-font-title: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI",
        "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      --crepe-font-default: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI",
        "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      --crepe-font-code: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo,
        monospace;
      --crepe-color-on-background: #1f2329;
      --crepe-color-on-surface: #1f2329;
      --crepe-color-on-surface-variant: #646a73;
      --crepe-color-primary: #1f2329;
      --crepe-color-outline: #dee0e3;
      --crepe-color-inline-area: #e4e6eb;
      --crepe-color-surface: #f5f6f7;
      --crepe-color-surface-low: #f2f3f5;
      --crepe-color-hover: #f2f3f5;
      --crepe-color-selected: #e4e6eb;
      --crepe-color-inline-code: #d83931;
    }
    /* --- Fixed top toolbar (DingTalk-doc style) ------------------------- */
    /* Crepe's own top bar paints icons with --crepe-color-outline, which this
       theme maps to a hairline grey; DingTalk uses mid-grey glyphs. */
    #editor .milkdown-top-bar {
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e8eaed;
      min-height: 46px;
      z-index: 20;
    }
    #editor .milkdown-top-bar .top-bar-item svg,
    #editor .milkdown-top-bar .top-bar-chevron svg {
      color: #4e5969;
      fill: #4e5969;
    }
    #editor .milkdown-top-bar .top-bar-item:hover svg,
    #editor .milkdown-top-bar .top-bar-item.active svg {
      color: #1f2329;
      fill: #1f2329;
    }
    #editor .milkdown-top-bar .top-bar-heading-label {
      color: #1f2329;
      font-weight: 500;
    }
    /* Disable heading selector when cursor is inside a list item */
    #editor .milkdown-top-bar.in-list-item .top-bar-heading-button {
      opacity: 0.42;
      cursor: not-allowed;
    }
    #editor .milkdown-top-bar.in-list-item .top-bar-heading-dropdown {
      display: none !important;
    }
    /* Toolbar button tooltip */
    #editor .milkdown-top-bar .top-bar-item[data-tip],
    #editor .milkdown-top-bar .top-bar-heading-button[data-tip] {
      position: relative;
    }
    #editor .milkdown-top-bar .top-bar-item[data-tip]::after,
    #editor .milkdown-top-bar .top-bar-heading-button[data-tip]::after {
      content: attr(data-tip);
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(31,35,41,.85);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      padding: 5px 8px;
      border-radius: 4px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms;
      z-index: 9999;
    }
    #editor .milkdown-top-bar .top-bar-item[data-tip]:hover::after,
    #editor .milkdown-top-bar .top-bar-heading-button[data-tip]:hover::after {
      opacity: 1;
      transition-delay: 250ms;
    }
    #editor .milkdown-top-bar .top-bar-divider {
      background: #e8eaed;
    }
    body.theme-dark #editor .milkdown-top-bar {
      background: #1e1e1e;
      border-bottom-color: #333;
    }
    body.theme-dark #editor .milkdown-top-bar .top-bar-item svg,
    body.theme-dark #editor .milkdown-top-bar .top-bar-chevron svg {
      color: #c4c8ce;
      fill: #c4c8ce;
    }
    body.theme-dark #editor .milkdown-top-bar .top-bar-item:hover svg,
    body.theme-dark #editor .milkdown-top-bar .top-bar-item.active svg,
    body.theme-dark #editor .milkdown-top-bar .top-bar-heading-label {
      color: #f0f2f5;
      fill: #f0f2f5;
    }

    #editor .ProseMirror {
      box-sizing: border-box;
      /* Left-aligned, full column width (no reading-width centering). */
      margin: 0;
      padding: 20px 32px 45vh;
      min-height: 100%;
      outline: none;
      font-family: var(--crepe-font-default);
      font-size: 16px;
      line-height: 1.75;
      color: #1f2329;
      letter-spacing: 0.01em;
      word-break: break-word;
      caret-color: #1f6bff;
    }
    /* Crepe draws the caret with prosemirror-virtual-cursor, whose colour came
       from --crepe-color-outline (a hairline grey) — nearly invisible. DingTalk
       paints a solid blue caret, so point the virtual cursor at the accent. */
    #editor .ProseMirror,
    #editor .ProseMirror-focused {
      --prosemirror-virtual-cursor-color: #1f6bff;
    }
    #editor .ProseMirror .prosemirror-virtual-cursor {
      border-left-width: 2px;
    }
    body.theme-dark #editor .ProseMirror {
      color: #e6e6e6;
    }
    /* Block rhythm: DingTalk keeps ~8px between blocks, not Crepe's 0.72em. */
    #editor .ProseMirror > * + * {
      margin-top: 8px;
    }

    /* --- Headings: sans-serif, bold, stepped sizes ----------------------- */
    #editor .ProseMirror h1,
    #editor .ProseMirror h2,
    #editor .ProseMirror h3,
    #editor .ProseMirror h4,
    #editor .ProseMirror h5,
    #editor .ProseMirror h6 {
      font-family: var(--crepe-font-title);
      font-weight: 600;
      color: #1f2329;
      padding: 0;
      letter-spacing: 0;
    }
    body.theme-dark #editor .ProseMirror h1,
    body.theme-dark #editor .ProseMirror h2,
    body.theme-dark #editor .ProseMirror h3,
    body.theme-dark #editor .ProseMirror h4,
    body.theme-dark #editor .ProseMirror h5,
    body.theme-dark #editor .ProseMirror h6 {
      color: #e6e6e6;
    }
    #editor .ProseMirror h1 {
      font-size: 28px;
      line-height: 1.4;
      margin-top: 24px;
    }
    #editor .ProseMirror h2 {
      font-size: 23px;
      line-height: 1.45;
      margin-top: 22px;
    }
    #editor .ProseMirror h3 {
      font-size: 19px;
      line-height: 1.5;
      margin-top: 20px;
    }
    #editor .ProseMirror h4 {
      font-size: 17px;
      line-height: 1.55;
      margin-top: 18px;
    }
    #editor .ProseMirror h5 {
      font-size: 16px;
      line-height: 1.6;
      margin-top: 16px;
    }
    #editor .ProseMirror h6 {
      font-size: 15px;
      line-height: 1.6;
      margin-top: 16px;
      color: #646a73;
    }
    /* No leading gap above the very first block (DingTalk flush start). */
    #editor .ProseMirror > h1:first-child,
    #editor .ProseMirror > h2:first-child,
    #editor .ProseMirror > h3:first-child,
    #editor .ProseMirror > h4:first-child,
    #editor .ProseMirror > h5:first-child,
    #editor .ProseMirror > h6:first-child,
    #editor .ProseMirror > p:first-child {
      margin-top: 0;
    }

    /* --- Paragraphs / lists --------------------------------------------- */
    #editor .ProseMirror p {
      margin: 0;
      padding: 0;
    }
    #editor .ProseMirror ul,
    #editor .ProseMirror ol {
      padding-left: 26px;
      margin: 0;
    }
    #editor .ProseMirror li {
      margin: 2px 0;
    }
    #editor .ProseMirror li p {
      margin: 0;
    }
    #editor .ProseMirror li > ul,
    #editor .ProseMirror li > ol {
      margin-top: 2px;
    }
    /* Task list: Crepe reserves a fixed 32px label row; match the 1.75 line
       box so the checkbox sits on the first text line instead of above it.
       List markers / numbers / bullets match the body font color. */
    #editor .milkdown-list-item-block li .label-wrapper,
    #editor .milkdown-list-item-block li .label-wrapper .label {
      height: 28px;
      padding: 0;
      width: 24px;
      color: inherit !important;
      font-weight: 600;
    }
    #editor .milkdown-list-item-block li .label-wrapper svg {
      color: currentColor !important;
      fill: currentColor !important;
    }
    #editor .ProseMirror li::marker {
      color: inherit;
      font-weight: 600;
    }
    body.theme-dark #editor .milkdown-list-item-block li .label-wrapper,
    body.theme-dark #editor .milkdown-list-item-block li .label-wrapper .label {
      color: inherit !important;
    }
    body.theme-dark #editor .milkdown-list-item-block li .label-wrapper svg {
      color: currentColor !important;
      fill: currentColor !important;
    }
    body.theme-dark #editor .ProseMirror li::marker {
      color: inherit;
    }

    /* --- Blockquote: soft grey panel with a light left rule ------------- */
    #editor .ProseMirror blockquote {
      position: relative;
      margin: 10px 0;
      padding: 10px 14px 10px 14px;
      background: #f5f6f7;
      border-radius: 4px;
      color: #646a73;
      box-sizing: border-box;
    }
    #editor .ProseMirror blockquote:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #d0d3d9;
      border-radius: 2px 0 0 2px;
    }
    #editor .ProseMirror blockquote > * + * {
      margin-top: 6px;
    }
    body.theme-dark #editor .ProseMirror blockquote {
      background: #262626;
      color: #a8a8a8;
    }
    body.theme-dark #editor .ProseMirror blockquote:before {
      background: #3a3a3a;
    }

    /* --- Inline code: light chip, DingTalk red ------------------------- */
    #editor .ProseMirror code {
      font-family: var(--crepe-font-code);
      font-size: 0.92em;
      padding: 1px 5px;
      border-radius: 3px;
      background: #f2f3f5;
      color: #d83931;
    }
    body.theme-dark #editor .ProseMirror code {
      background: #2a2a2a;
      color: #ff8f85;
    }

    /* --- Fenced code block --------------------------------------------- */
    #editor .milkdown-code-block {
      margin: 12px 0;
      border-radius: 6px;
      background: #f7f8fa;
      border: 1px solid #e5e6eb;
      overflow: hidden;
    }
    #editor .milkdown-code-block .cm-editor {
      font-family: var(--crepe-font-code);
      font-size: 13px;
      line-height: 1.65;
      background: transparent;
    }
    #editor .milkdown-code-block .cm-editor .cm-scroller {
      padding: 4px 0;
    }
    #editor .milkdown-code-block .cm-editor .cm-content {
      padding: 8px 14px;
    }
    body.theme-dark #editor .milkdown-code-block {
      background: #232323;
      border-color: #333;
    }

    /* --- Tables: DingTalk grid ------------------------------------------ */
    #editor .milkdown-table-block {
      margin: 12px 0;
    }
    #editor .ProseMirror table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      table-layout: auto;
    }
    #editor .ProseMirror th,
    #editor .ProseMirror td {
      border: 1px solid #e5e6eb;
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
      line-height: 1.6;
      min-width: 60px;
    }
    #editor .ProseMirror th {
      background: #f5f6f7;
      font-weight: 600;
      color: #1f2329;
    }
    body.theme-dark #editor .ProseMirror th,
    body.theme-dark #editor .ProseMirror td {
      border-color: #3a3a3a;
    }
    body.theme-dark #editor .ProseMirror th {
      background: #262626;
      color: #e6e6e6;
    }

    /* --- Rules / links -------------------------------------------------- */
    #editor .ProseMirror hr {
      border: none;
      border-top: 1px solid #e5e6eb;
      margin: 20px 0;
    }
    #editor .ProseMirror a {
      color: #3370ff;
      text-decoration: none;
    }
    #editor .ProseMirror a:hover {
      text-decoration: underline;
    }
    #editor .ProseMirror strong {
      font-weight: 600;
    }

    /* Images never overflow the column; Crepe sizes them by ratio. */
    #editor .milkdown-image-block {
      max-width: 100%;
      margin: 12px 0;
    }
    #editor .milkdown-image-block:not(:has(> .image-edit:not(.hidden))) {
      width: fit-content;
      max-width: 240px;
    }
    #editor .milkdown-image-block .image-wrapper {
      width: fit-content;
      max-width: 240px;
    }
    /* DingTalk inserts at the caret and keeps the image flush left; Crepe
       centres every block image. */
    #editor .milkdown-image-block > .image-wrapper {
      margin: 0;
      justify-content: flex-start;
    }
    /* Suppress Crepe's grey NodeSelection tint over the image box. */
    #editor .milkdown-image-block.selected > .image-wrapper::before {
      display: none !important;
    }
    /* Crepe's own chrome (an emoji caption bubble and a 4px bottom grip) is
       replaced by the widget below, which is easier to hit and also deletes. */
    #editor .milkdown-image-block .operation,
    #editor .milkdown-image-block .image-resize-handle,
    #editor .milkdown-image-block .caption-input {
      display: none;
    }
    /* Inline images: allow multiple images side-by-side on the same line. */
    #editor .milkdown-image-inline {
      display: inline-flex;
      vertical-align: middle;
      margin: 4px 8px 4px 0;
      outline: none !important;
    }
    #editor .milkdown-image-inline .empty-image-inline {
      border: 1px dashed rgba(31, 107, 255, 0.55);
      background: rgba(31, 107, 255, 0.04);
      border-radius: 6px;
      padding: 4px 10px;
    }
    #editor .milkdown-image-inline .empty-image-inline .placeholder .uploader,
    #editor .milkdown-image-block .image-edit .placeholder .uploader {
      color: #1f6bff !important;
      font-weight: 500;
    }
    #editor .milkdown-image-block .image-wrapper img,
    #editor .milkdown-image-inline > img.image-inline {
      /* Fixed placeholder thumbnail box regardless of original image dimensions. */
      width: 240px !important;
      height: 150px !important;
      max-width: 240px !important;
      max-height: 150px !important;
      min-width: 240px !important;
      min-height: 150px !important;
      object-fit: contain !important;
      box-sizing: border-box;
      padding: 4px;
      border-radius: 6px;
      border: 1.5px dashed rgba(31, 107, 255, 0.55);
      background: rgba(31, 107, 255, 0.04);
      cursor: pointer;
      display: inline-block;
      vertical-align: middle;
    }
    body.theme-dark #editor .milkdown-image-block .image-wrapper img,
    body.theme-dark #editor .milkdown-image-inline > img.image-inline {
      border-color: rgba(91, 155, 255, 0.55);
      background: rgba(91, 155, 255, 0.08);
    }
    /* Broken / not-yet-loaded images: tinted background. */
    #editor .milkdown-image-block .image-wrapper img:not([src]),
    #editor .milkdown-image-block .image-wrapper img[src=""],
    #editor .milkdown-image-inline > img.image-inline:not([src]),
    #editor .milkdown-image-inline > img.image-inline[src=""] {
      background: rgba(31, 107, 255, 0.08);
    }
    /* Lightbox overlay */
    #dsk-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0, 0, 0, 0.72);
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    #dsk-lightbox.on { display: flex; }
    #dsk-lightbox img {
      max-width: 90vw;
      max-height: 88vh;
      border-radius: 6px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      object-fit: contain;
      cursor: default;
      pointer-events: none;
      animation: lbIn 160ms cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes lbIn {
      from { opacity: 0; transform: scale(0.88); }
      to   { opacity: 1; transform: none; }
    }
    #dsk-lightbox-close {
      position: fixed;
      top: 14px; right: 18px;
      background: rgba(255,255,255,0.14);
      border: none; color: #fff;
      font-size: 22px; line-height: 1;
      width: 32px; height: 32px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #dsk-lightbox-close:hover { background: rgba(255,255,255,0.28); }
    /* --- Image mask overlay: fixed placeholder mask with "预览" button & delete --- */
    #dsk-img-chrome {
      position: fixed;
      z-index: 60;
      pointer-events: none;
      display: none;
      border-radius: 6px;
      overflow: hidden;
    }
    #dsk-img-chrome.on { display: block; }
    #dsk-img-chrome .mask {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      border: 1.5px solid #1f6bff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      pointer-events: auto;
      backdrop-filter: blur(1px);
    }
    #dsk-img-chrome .preview-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      background: rgba(31, 107, 255, 0.92);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: background 120ms, transform 120ms;
    }
    #dsk-img-chrome .preview-btn:hover {
      background: #1557e0;
      transform: scale(1.03);
    }
    #dsk-img-chrome .preview-btn svg {
      width: 14px;
      height: 14px;
      display: block;
    }
    #dsk-img-chrome .del {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(31, 35, 41, 0.65);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 120ms;
    }
    #dsk-img-chrome .del:hover {
      background: #d83931;
    }
    #dsk-img-chrome .del svg {
      width: 13px;
      height: 13px;
      display: block;
    }
    /* Floating UI chrome (block handle / slash menu / toolbar) must sit above
       the editor surface, which owns the whole stage. */
    .milkdown-block-handle,
    .milkdown-slash-menu,
    .milkdown-toolbar,
    .milkdown-link-preview,
    .milkdown-link-edit,
    .milkdown-latex-inline-edit {
      z-index: 30;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <!-- Bundle loads async after title chromeReady — Typora-class open. -->
  <script>
(function () {
  var editorApi = null;   // createDeskNoteEditor() handle
  var suppress = false;
  var latestMd = "";
  var mdDirty = false;
  var changePostTimer = null;
  var ignoreDirtyPostsUntil = 0;
  var CHANGE_POST_MS = 150;
  var bundleLoading = false;
  var bundleLoaded = false;
  var pendingBoot = null;  // { md, theme, baseUrl } while the bundle loads
  var editorFontFace = "Microsoft YaHei";
  var editorFontPt = 12;
  var assetBaseUrl = "";
  var uploadSeq = 0;
  var pendingUploads = {};

  function post(msg) {
    if (window.chrome && chrome.webview && chrome.webview.postMessage) {
      chrome.webview.postMessage(JSON.stringify(msg));
    }
  }

  function readFileAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(new Error("read failed")); };
      reader.readAsDataURL(file);
    });
  }

  function uploadImageFile(file) {
    if (!file) return Promise.resolve("");
    return readFileAsDataUrl(file).then(function (dataUrl) {
      if (!dataUrl) return "";
      if (!(window.chrome && chrome.webview && chrome.webview.postMessage)) {
        return dataUrl;
      }
      return new Promise(function (resolve) {
        var id = "up_" + (++uploadSeq) + "_" + Date.now();
        var timer = setTimeout(function () {
          if (pendingUploads[id]) {
            delete pendingUploads[id];
            resolve(dataUrl);
          }
        }, 5000);
        pendingUploads[id] = function (savedUrl) {
          clearTimeout(timer);
          delete pendingUploads[id];
          resolve(savedUrl || dataUrl);
        };
        post({
          type: "uploadImage",
          id: id,
          name: String(file.name || "image.png"),
          mime: String(file.type || "image/png"),
          dataUrl: dataUrl
        });
      });
    });
  }

  function trimStr(s) {
    return String(s || "").replace(/^\s+|\s+$/g, "");
  }

  // When false, body-only files keep no leading "# …" until the user types a title.
  var emitTitleLine = true;

  // Leading ATX heading ↔ native title strip; remainder is the body (Typora).
  function splitTitleBody(md) {
    var raw = String(md || "");
    if (raw.charCodeAt(0) === 0xfeff) raw = raw.slice(1);
    var prefix = "";
    // Keep YAML front matter with the body; title is first heading after it.
    if (/^---\r?\n/.test(raw)) {
      var fmEnd = raw.indexOf("\n---", 4);
      if (fmEnd >= 0) {
        var afterFm = raw.indexOf("\n", fmEnd + 4);
        if (afterFm >= 0) {
          prefix = raw.slice(0, afterFm + 1);
          raw = raw.slice(afterFm + 1).replace(/^\r?\n*/, "");
        }
      }
    }
    var m = /^(#{1,6})[ \t]*(.*?)[ \t]*\r?\n([\s\S]*)$/.exec(raw);
    if (m) {
      emitTitleLine = true;
      return {
        title: trimStr(m[2].replace(/\s+#+\s*$/, "")),
        body: prefix + m[3].replace(/^\r?\n*/, "")
      };
    }
    m = /^(#{1,6})[ \t]*(.*?)\s*$/.exec(raw);
    if (m) {
      emitTitleLine = true;
      return { title: trimStr(m[2].replace(/\s+#+\s*$/, "")), body: prefix };
    }
    emitTitleLine = false;
    return { title: "", body: prefix + raw };
  }

  function joinTitleBody(title, body) {
    var t = trimStr(title).replace(/[\r\n]+/g, " ");
    var b = String(body || "").replace(/^\r?\n+/, "");
    // Body-only notes: do not invent an empty "# \n\n" on first save.
    if (!t && !emitTitleLine) return b;
    emitTitleLine = true;
    return "# " + t + "\n\n" + b;
  }

  // Host owns the visible title; keep a shadow string for compose/save.
  var hostTitle = "";

  function currentTitle() { return hostTitle; }

  function setTitleValue(t) {
    hostTitle = t || "";
  }

  function composedMarkdown() {
    var body = "";
    if (editorApi) {
      try { body = editorApi.getMarkdown() || ""; } catch (e) { body = ""; }
    }
    return joinTitleBody(currentTitle(), body);
  }

  // Native title EN_CHANGE → keep the composed markdown in sync.
  window.__desknoteSetHostTitle = function (t) {
    hostTitle = String(t || "").replace(/[\r\n]+/g, " ");
    if (hostTitle) emitTitleLine = true;
    if (suppress) {
      latestMd = composedMarkdown();
      return;
    }
    mdDirty = true;
    refreshLatestMd();
    if (Date.now() < ignoreDirtyPostsUntil) return;
    post({ type: "changed", md: latestMd });
  };

  function refreshLatestMd() {
    latestMd = composedMarkdown();
    mdDirty = false;
  }

  function scheduleChangePost() {
    if (Date.now() < ignoreDirtyPostsUntil) return;
    if (changePostTimer) return;
    changePostTimer = setTimeout(function () {
      changePostTimer = null;
      if (Date.now() < ignoreDirtyPostsUntil) return;
      if (mdDirty) refreshLatestMd();
      post({ type: "changed", md: latestMd });
    }, CHANGE_POST_MS);
  }

  function signalDirty() {
    if (Date.now() < ignoreDirtyPostsUntil) return;
    post({ type: "dirty" });
  }

  function clearPendingDirtyPosts() {
    mdDirty = false;
    ignoreDirtyPostsUntil = Date.now() + 600;
    if (changePostTimer) {
      clearTimeout(changePostTimer);
      changePostTimer = null;
    }
  }

  function focusBody() {
    try { if (editorApi) editorApi.focus(); } catch (e) {}
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  function onBundleReady() {
    bundleLoaded = true;
    bundleLoading = false;
    var queued = pendingBoot;
    pendingBoot = null;
    if (queued) boot(queued.md, queued.theme, queued.baseUrl);
    else if (!editorApi) boot("", "light", "");
  }

  function ensureBundleLoaded() {
    if (bundleLoaded && window.__desknoteEditor) {
      if (pendingBoot && !editorApi) {
        var queued = pendingBoot;
        pendingBoot = null;
        boot(queued.md, queued.theme, queued.baseUrl);
      }
      return;
    }
    if (bundleLoading) return;
    bundleLoading = true;
    var s = document.createElement("script");
    s.src = "vendor/desknote-editor.js";
    s.async = true;
    s.onload = onBundleReady;
    s.onerror = function () { bundleLoading = false; };
    document.head.appendChild(s);
  }

  // Overlap the bundle fetch with the host round-trip (ready → set).
  ensureBundleLoaded();

  // Toolbar tooltip: ordered labels matching the 14 .top-bar-item buttons in desknote-editor.js
  var TOP_BAR_ITEM_TIPS = [
    '加粗',
    '斜体',
    '删除线',
    '行内代码',
    '无序列表',
    '有序列表',
    '任务列表',
    '插入链接',
    '插入图片',
    '插入表格',
    '代码块',
    '数学公式',
    '引用',
    '分割线'
  ];

  function installToolbarTooltips() {
    var bar = document.querySelector('#editor .milkdown-top-bar');
    if (!bar) {
      setTimeout(installToolbarTooltips, 300);
      return;
    }
    function applyTips() {
      var headingBtn = bar.querySelector('.top-bar-heading-button');
      if (headingBtn && !headingBtn.dataset.tip) {
        headingBtn.dataset.tip = '段落与标题';
      }
      var items = bar.querySelectorAll('.top-bar-item');
      items.forEach(function (btn, idx) {
        if (btn.dataset.tip) return;
        if (idx < TOP_BAR_ITEM_TIPS.length) {
          btn.dataset.tip = TOP_BAR_ITEM_TIPS[idx];
        }
      });
    }
    applyTips();
    var obs = new MutationObserver(applyTips);
    obs.observe(bar, { childList: true, subtree: true });
  }

  function applyDoc(md, theme) {
    var parts = splitTitleBody(md || "");
    setTitleValue(parts.title);
    latestMd = joinTitleBody(parts.title, parts.body);
    var dark = String(theme || "").toLowerCase().indexOf("dark") >= 0;
    document.body.classList.toggle("theme-dark", dark);
    return parts;
  }

  function boot(md, theme, baseUrl) {
    if (!(window.__desknoteEditor && window.__desknoteEditor.createDeskNoteEditor)) {
      pendingBoot = { md: md || "", theme: theme || "", baseUrl: baseUrl || "" };
      ensureBundleLoaded();
      return;
    }
    assetBaseUrl = String(baseUrl || "");
    var parts = applyDoc(md || "", theme);
    var el = document.getElementById("editor");
    if (el) {
      el.classList.remove("desknote-body-pending");
      el.innerHTML = "";
    }
    suppress = true;
    try {
      editorApi = window.__desknoteEditor.createDeskNoteEditor({
        root: el,
        defaultValue: parts.body || "",
        assetBaseUrl: assetBaseUrl,
        onUpload: uploadImageFile,
        onMarkdownUpdated: function (markdown) {
          if (suppress) return;
          mdDirty = true;
          signalDirty();
          scheduleChangePost();
        },
        onMounted: function () {
          setTimeout(function () {
            suppress = false;
            applyDefaultFont();
            post({ type: "contentReady" });
            try { focusBody(); } catch (e) {}
            installToolbarTooltips();
          }, 0);
        }
      });
    } catch (e) {
      editorApi = null;
      suppress = false;
      post({ type: "contentReady" });
    }
  }

  // ---------------------------------------------------------------------
  // Host → page
  // ---------------------------------------------------------------------
  window.__desknoteWysiwygSet = function (md, theme, baseUrl) {
    mdDirty = false;
    hideImgChrome();
    if (changePostTimer) {
      clearTimeout(changePostTimer);
      changePostTimer = null;
    }
    assetBaseUrl = String(baseUrl || "");
    var parts = applyDoc(md || "", theme || "");
    // Body surface ready to cover the RichEdit staging buffer.
    post({ type: "chromeReady" });
    if (!editorApi) {
      var elPend = document.getElementById("editor");
      if (elPend) elPend.classList.add("desknote-body-pending");
      pendingBoot = { md: md || "", theme: theme || "", baseUrl: assetBaseUrl };
      ensureBundleLoaded();
      return;
    }
    var elLive = document.getElementById("editor");
    if (elLive) elLive.classList.remove("desknote-body-pending");
    suppress = true;
    try {
      editorApi.setAssetBaseUrl(assetBaseUrl);
      editorApi.setMarkdown(parts.body || "");
      post({ type: "contentReady" });
    } catch (e) {
      post({ type: "contentReady" });
    } finally {
      setTimeout(function () {
        suppress = false;
        window.__desknoteWysiwygResize(window.innerHeight);
        try { focusBody(); } catch (e) {}
      }, 50);
    }
  };

  window.__desknoteWysiwygGet = function () {
    if (mdDirty || editorApi) refreshLatestMd();
    // Pull during Save — drop pending dirty timers so a late post cannot
    // re-arm the tab disc before the host's ackClean arrives.
    if (changePostTimer) {
      clearTimeout(changePostTimer);
      changePostTimer = null;
    }
    mdDirty = false;
    return latestMd;
  };

  window.__desknoteSetEditorFont = function (face, pt) {
    editorFontFace = String(face || "Microsoft YaHei");
    editorFontPt = Math.max(8, Math.min(48, Number(pt) || 12));
    applyDefaultFont();
  };

  function applyDefaultFont() {
    var style = document.getElementById("desknote-font-style");
    if (!style) {
      style = document.createElement("style");
      style.id = "desknote-font-style";
      document.head.appendChild(style);
    }
    var safe = editorFontFace.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    style.textContent =
      "#editor .ProseMirror{" +
      'font-family:"' + safe + '","Microsoft YaHei","微软雅黑",sans-serif;' +
      "font-size:" + editorFontPt + "pt;" +
      "}";
  }

  window.__desknoteWysiwygResize = function (h) {
    var total = Math.max(120, Number(h) || window.innerHeight || 480);
    var el = document.getElementById("editor");
    if (el) el.style.height = total + "px";
  };

  // Shift+Enter: Crepe maps it to a plain Enter; the host steals the key and
  // asks for a hard break instead (Notepad-class line break, no new block).
  window.__desknoteSoftBreak = function () {
    if (!editorApi) return false;
    try {
      editorApi.insertHardBreak();
      mdDirty = true;
      signalDirty();
      scheduleChangePost();
      return true;
    } catch (e) { return false; }
  };

  function bindSoftBreakKeys() {
    var root = document.getElementById("editor") || document.body;
    if (!root || root.__desknoteSoftBound) return;
    root.__desknoteSoftBound = true;
    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" || !e.shiftKey || e.ctrlKey || e.altKey ||
          e.metaKey) {
        return;
      }
      e.preventDefault();
      e.stopPropagation();
      if (typeof e.stopImmediatePropagation === "function") {
        e.stopImmediatePropagation();
      }
      window.__desknoteSoftBreak();
    }, true);
  }

  // ---------------------------------------------------------------------
  // Lightbox: preview image at full size.
  // ---------------------------------------------------------------------
  var lbEl = null;

  function lbEnsure() {
    if (lbEl) return lbEl;
    var el = document.createElement("div");
    el.id = "dsk-lightbox";
    el.innerHTML = '<button id="dsk-lightbox-close" aria-label="关闭">×</button><img />';
    el.addEventListener("click", function (e) {
      if (e.target === el || e.target.id === "dsk-lightbox-close") hideLightbox();
    });
    document.body.appendChild(el);
    lbEl = el;
    return el;
  }

  function showLightbox(src) {
    var el = lbEnsure();
    var img = el.querySelector("img");
    img.src = src;
    el.classList.add("on");
  }

  function hideLightbox() {
    if (lbEl) lbEl.classList.remove("on");
  }

  // ---------------------------------------------------------------------
  // Image mask overlay: hover or click an image to show a mask ("遮罩") with
  // a prominent "预览" button and a corner delete button.
  // ---------------------------------------------------------------------
  var imgChrome = null;
  var imgTarget = null;
  var imgHideTimer = null;

  function clearImgHideTimer() {
    if (imgHideTimer) {
      clearTimeout(imgHideTimer);
      imgHideTimer = null;
    }
  }

  function scheduleHideImgChrome() {
    clearImgHideTimer();
    imgHideTimer = setTimeout(function () {
      hideImgChrome();
    }, 120);
  }

  function imgChromeEl() {
    if (imgChrome) return imgChrome;
    var el = document.createElement("div");
    el.id = "dsk-img-chrome";
    el.innerHTML =
      '<div class="mask">' +
        '<button type="button" class="preview-btn">' +
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">' +
            '<path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8s-2.4 4.5-6.5 4.5S1.5 8 1.5 8z"/>' +
            '<circle cx="8" cy="8" r="2.2"/>' +
          '</svg>' +
          '<span>预览</span>' +
        '</button>' +
        '<button type="button" class="del" title="删除图片">' +
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
          'stroke-width="1.5"><path d="M3 4.5h10M6.5 4.5V3h3v1.5" ' +
          'stroke-linecap="round"/><path d="M4.5 4.5l.6 8a1 1 0 0 0 1 .9h3.8a1 1 0 0 0 ' +
          '1-.9l.6-8" stroke-linecap="round"/></svg>' +
        '</button>' +
      '</div>';
    document.body.appendChild(el);
    el.addEventListener("mouseenter", function () {
      clearImgHideTimer();
    });
    el.addEventListener("mouseleave", function () {
      scheduleHideImgChrome();
    });
    el.querySelector(".mask").addEventListener("mousedown", function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
    el.querySelector(".mask").addEventListener("click", function (e) {
      if (e.target.closest(".del")) return;
      e.preventDefault();
      e.stopPropagation();
      if (imgTarget && imgTarget.src) showLightbox(imgTarget.src);
    });
    el.querySelector(".del").addEventListener("mousedown", function (e) {
      e.preventDefault();
      e.stopPropagation();
    });
    el.querySelector(".del").addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      deleteImg();
    });
    imgChrome = el;
    return el;
  }

  function placeImgChrome() {
    if (!imgChrome || !imgTarget) return;
    if (!document.body.contains(imgTarget)) {
      hideImgChrome();
      return;
    }
    var rect = imgTarget.getBoundingClientRect();
    if (!rect.width || !rect.height) {
      hideImgChrome();
      return;
    }
    imgChrome.style.left = rect.left + "px";
    imgChrome.style.top = rect.top + "px";
    imgChrome.style.width = rect.width + "px";
    imgChrome.style.height = rect.height + "px";
  }

  function showImgChrome(img) {
    if (!img) return;
    clearImgHideTimer();
    imgTarget = img;
    imgChromeEl().classList.add("on");
    placeImgChrome();
  }

  function hideImgChrome() {
    clearImgHideTimer();
    imgTarget = null;
    if (imgChrome) imgChrome.classList.remove("on");
  }

  function deleteImg() {
    if (!imgTarget || !editorApi) return;
    var img = imgTarget;
    hideImgChrome();
    try {
      if (editorApi.deleteImage(img)) {
        mdDirty = true;
        signalDirty();
        scheduleChangePost();
      }
    } catch (e) {}
  }

  var IMG_SELECTOR = ".milkdown-image-block .image-wrapper img, .milkdown-image-inline > img.image-inline";

  function bindImageChrome() {
    var root = document.getElementById("editor");
    if (!root || root.__dskImgBound) return;
    root.__dskImgBound = true;
    root.addEventListener("mouseover", function (e) {
      var img = e.target && e.target.closest
        ? e.target.closest(IMG_SELECTOR)
        : null;
      if (img) {
        showImgChrome(img);
      }
    }, true);
    root.addEventListener("mouseout", function (e) {
      var img = e.target && e.target.closest
        ? e.target.closest(IMG_SELECTOR)
        : null;
      if (img && img === imgTarget) {
        scheduleHideImgChrome();
      }
    }, true);
    root.addEventListener("mousedown", function (e) {
      var t = e.target;
      if (t && t.closest && t.closest(".image-edit")) {
        return;
      }
      var img = t && t.closest ? t.closest(IMG_SELECTOR) : null;
      if (img) {
        var r = img.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right &&
            e.clientY >= r.top && e.clientY <= r.bottom) {
          showImgChrome(img);
          return;
        }
      }
      if (imgTarget) hideImgChrome();
      // Prevent clicking blank space beside an image row from selecting an image node.
      var block = t && t.closest ? t.closest(".milkdown-image-block") : null;
      if (block) {
        var bImg = block.querySelector(".image-wrapper img");
        if (bImg && editorApi && editorApi.placeCaretAfterImage) {
          e.preventDefault();
          e.stopPropagation();
          editorApi.placeCaretAfterImage(bImg, false);
          return;
        }
      }
      var allImgs = root.querySelectorAll(IMG_SELECTOR);
      var rowImgs = [];
      for (var i = 0; i < allImgs.length; i++) {
        var ir = allImgs[i].getBoundingClientRect();
        if (ir.width > 0 && ir.height > 0 &&
            e.clientY >= ir.top - 4 && e.clientY <= ir.bottom + 4) {
          rowImgs.push({ el: allImgs[i], rect: ir });
        }
      }
      if (rowImgs.length > 0 && editorApi && editorApi.placeCaretAfterImage) {
        var first = rowImgs[0];
        var last = rowImgs[rowImgs.length - 1];
        if (e.clientX > last.rect.right) {
          e.preventDefault();
          e.stopPropagation();
          editorApi.placeCaretAfterImage(last.el, false);
        } else if (e.clientX < first.rect.left) {
          e.preventDefault();
          e.stopPropagation();
          editorApi.placeCaretAfterImage(first.el, true);
        }
      }
    }, true);
    root.addEventListener("dblclick", function (e) {
      var img = e.target && e.target.closest
        ? e.target.closest(IMG_SELECTOR)
        : null;
      if (img && img.src) {
        e.preventDefault();
        e.stopPropagation();
        showLightbox(img.src);
      }
    }, true);
    document.addEventListener("mousedown", function (e) {
      if (!imgTarget) return;
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest("#dsk-img-chrome") || t.closest("#editor")) return;
      hideImgChrome();
    }, true);
    window.addEventListener("scroll", function () {
      if (imgTarget) placeImgChrome();
    }, true);
    window.addEventListener("resize", function () {
      if (imgTarget) placeImgChrome();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && imgTarget) hideImgChrome();
      if (e.key === "Escape") hideLightbox();
    });
  }

  // ---------------------------------------------------------------------
  // WebView2 message bridge (protocol unchanged from the Toast shell)
  // ---------------------------------------------------------------------
  if (window.chrome && chrome.webview) {
    chrome.webview.addEventListener("message", function (e) {
      var msg = e.data || {};
      if (typeof msg === "string") {
        try { msg = JSON.parse(msg); } catch (err) { msg = {}; }
      }
      if (msg.type === "set") {
        window.__desknoteWysiwygSet(msg.md || "", msg.theme || "",
                                    msg.baseUrl || "");
        window.__desknoteWysiwygResize(window.innerHeight);
      } else if (msg.type === "ackClean") {
        // Host saved — drop pending dirty posts so the tab check can stick.
        clearPendingDirtyPosts();
      } else if (msg.type === "get") {
        post({ type: "md", md: window.__desknoteWysiwygGet() });
      } else if (msg.type === "uploadedImage") {
        var cb = msg.id && pendingUploads[msg.id];
        if (cb) cb(msg.url || "");
      } else if (msg.type === "insertImage") {
        if (!editorApi) return;
        var url = msg.url || "";
        if (!url) return;
        try {
          editorApi.insertImage(url, msg.alt || "");
          mdDirty = true;
          signalDirty();
          scheduleChangePost();
        } catch (err) {}
      } else if (msg.type === "insert") {
        if (!editorApi) return;
        try {
          editorApi.insertText(msg.md || "");
          mdDirty = true;
          signalDirty();
          scheduleChangePost();
        } catch (err) {}
      }
    });
  }

  // Scroll reporting (host keeps the preview pane in sync).
  var suppressScrollEmit = false;
  var scrollRaf = 0;
  function scrollContainer() {
    return document.getElementById("editor") || document.scrollingElement || document.documentElement;
  }
  function emitScroll() {
    if (suppressScrollEmit || scrollRaf) return;
    scrollRaf = requestAnimationFrame(function () {
      scrollRaf = 0;
      if (suppressScrollEmit) return;
      var el = scrollContainer();
      var max = Math.max(1, el.scrollHeight - el.clientHeight);
      post({ type: "scroll", ratio: el.scrollTop / max });
    });
  }
  window.addEventListener("scroll", emitScroll, true);
  window.__desknoteSetScrollRatio = function (r) {
    suppressScrollEmit = true;
    var el = scrollContainer();
    var max = Math.max(1, el.scrollHeight - el.clientHeight);
    el.scrollTop = Math.max(0, Math.min(1, Number(r) || 0)) * max;
    setTimeout(function () { suppressScrollEmit = false; }, 30);
  };
  window.__desknoteGetScrollRatio = function () {
    var el = scrollContainer();
    var max = Math.max(1, el.scrollHeight - el.clientHeight);
    return el.scrollTop / max;
  };

  function ready() {
    bindSoftBreakKeys();
    bindImageChrome();
    ensureBundleLoaded();
    post({ type: "ready" });
    setTimeout(function () {
      var cur = latestMd || (editorApi ? composedMarkdown() : "");
      if (!cur || cur === "# \n\n") {
        if (!editorApi) post({ type: "needContent" });
      }
      window.__desknoteWysiwygResize(window.innerHeight);
    }, 50);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", ready);
  } else {
    ready();
  }
  window.addEventListener("resize", function () {
    window.__desknoteWysiwygResize(window.innerHeight);
  });
})();
  </script>
</body>
</html>
