<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>账号管理</title>
<style>
  :root {
    --card: #FFFFFF;
    --border: rgba(15, 23, 42, 0.10);
    --border-solid: #C6CEDA;
    --text: #172033;
    --muted: #66788C;
    --accent: #2F6FED;
    --accent-soft: #EAF1FE;
    --accent-hover: rgba(47, 111, 237, 0.20);
    --row-hover: rgba(234, 241, 254, 0.5);
    --primary: #16A34A;
    --danger: #E5484D;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    overflow: hidden;
    user-select: none;
  }
  #card {
    height: 100%;
    display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  #title-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px 8px 12px;
    background: rgba(255, 255, 255, 0.88);
    border-bottom: 1px solid var(--border);
    cursor: move;
  }
  #title { font-size: 14px; font-weight: 700; }
  #user { color: var(--muted); font-size: 11px; }
  #hint {
    color: var(--muted); font-size: 11px;
    margin-left: auto; padding-right: 6px;
  }
  #hide {
    width: 28px; height: 28px; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); font-size: 18px; cursor: pointer;
    padding: 2px 6px; line-height: 1;
  }
  #hide:hover { background: rgba(224, 231, 255, 0.35); color: var(--text); }
  .toolbar {
    display: flex; gap: 4px; align-items: center;
    padding: 8px 10px 4px;
  }
  .toolbar input {
    flex: 1; min-width: 0; height: 30px; padding: 4px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font: inherit; outline: none; background: var(--card); color: var(--text);
  }
  .toolbar input:focus { border-color: var(--accent); }
  .tbtn {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; padding: 2px 6px; border-radius: 6px; cursor: pointer;
  }
  .tbtn:hover { background: rgba(224, 231, 255, 0.35); color: var(--text); }
  .chip {
    border: 1px solid var(--accent);
    background: rgba(224, 231, 255, 0.22);
    color: var(--accent);
    font: inherit; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .chip:hover { background: var(--accent-hover); color: var(--text); }
  .chip.danger {
    border-color: var(--danger); color: var(--danger); background: transparent;
  }
  .chip.danger:hover { background: rgba(239, 68, 68, 0.12); }
  #list {
    flex: 1; overflow: auto; padding: 4px 8px 8px;
    background: transparent;
  }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb {
    background: #C5CED9; border-radius: 8px;
  }
  .row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 10px;
    position: relative;
    box-shadow: var(--shadow-sm);
  }
  .row.pinned { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .row.dragging { opacity: 0.45; }
  .row.drag-over { outline: 2px dashed var(--accent); }
  .grip {
    position: absolute; left: 4px; top: 12px; width: 14px; height: 28px;
    cursor: grab; color: var(--muted); font-size: 12px; line-height: 14px;
    letter-spacing: -1px; user-select: none;
  }
  .grip:active { cursor: grabbing; }
  .pin-btn {
    border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 14px; cursor: pointer; padding: 0 4px;
  }
  .pin-btn.on { color: var(--accent); }
  .row:hover {
    background: var(--row-hover);
    border-color: var(--accent);
  }
  .row-top {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .row-title {
    font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta {
    font-size: 12px; color: var(--muted);
    word-break: break-all; margin: 0 0 6px; cursor: pointer;
    line-height: 1.35;
  }
  .meta:hover, .meta.hot {
    color: var(--accent); font-weight: 600; text-decoration: underline;
  }
  .pass-row {
    display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
  }
  .pass-row .meta { margin: 0; flex: 1; min-width: 0; }
  .actions {
    display: flex; gap: 6px; justify-content: flex-end; margin-top: 2px;
  }
  #status {
    padding: 4px 12px 10px;
    color: var(--muted); font-size: 12px; line-height: 1.4;
  }
  #empty { color: var(--muted); text-align: center; padding: 36px 12px; }
  #modal {
    display: none; position: absolute; inset: 0;
    background: rgba(26, 35, 50, 0.28);
    align-items: center; justify-content: center; z-index: 5;
  }
  #modal.on { display: flex; }
  #form {
    width: min(360px, 92%);
    background: #fff; border-radius: 12px; border: 1px solid var(--border-solid);
    padding: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
  }
  #form h3 { margin: 0 0 10px; font-size: 15px; }
  .field { margin-bottom: 8px; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    margin-bottom: 3px; font-weight: 600;
  }
  .field input {
    width: 100%; height: 32px; padding: 0 10px;
    border: 1px solid var(--border-solid); border-radius: 8px; font: inherit;
  }
  .strength { min-height: 14px; font-size: 12px; color: var(--muted); }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .btn {
    border: 1px solid var(--border-solid); background: #fff; border-radius: 6px;
    padding: 7px 14px; font: inherit; cursor: pointer; font-weight: 600;
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: #15803D; }
</style>
</head>
<body>
<div id="card">
  <div id="title-bar">
    <div id="title">账号管理</div>
    <div id="user"></div>
    <div id="hint">双击字段可复制</div>
    <button type="button" id="hide" title="关闭">×</button>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="搜索名称 / 账号 / 网址…" />
    <button type="button" class="tbtn" id="btn-refresh">刷新</button>
    <button type="button" class="tbtn" id="btn-add">新建</button>
    <button type="button" class="tbtn" id="btn-sync">同步</button>
    <button type="button" class="tbtn" id="btn-auth">登录</button>
    <button type="button" class="tbtn" id="btn-register" style="display:none">注册</button>
  </div>
  <div id="list"><div id="empty">（暂无条目）</div></div>
  <div id="status"></div>
</div>
<div id="modal">
  <div id="form">
    <h3 id="form-title">新建账号</h3>
    <div class="field"><label>标题</label><input id="f-title" /></div>
    <div class="field"><label>用户</label><input id="f-user" /></div>
    <div class="field"><label>密码</label><input id="f-pass" /></div>
    <div class="field">
      <div class="strength"><span id="f-strength"></span></div>
    </div>
    <div class="field"><label>网址</label><input id="f-url" /></div>
    <div class="field"><label>备注</label><input id="f-note" /></div>
    <div class="form-actions">
      <button type="button" class="btn" id="f-cancel">取消</button>
      <button type="button" class="btn primary" id="f-ok">保存</button>
    </div>
  </div>
</div>
<script>
  const state = { items: [], logged_in: false, session: '', status: '', editIndex: -1, revealed: {}, plainShown: {} };
  function post(obj) {
    try {
      if (window.chrome && window.chrome.webview) {
        chrome.webview.postMessage(JSON.stringify(obj));
      }
    } catch (e) {}
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function clipLine(label, value) {
    let shown = value ? String(value) : '（空）';
    if (shown.length > 56) shown = shown.slice(0, 53) + '…';
    return label + '：' + shown;
  }
  function maskPass(len) {
    const n = Math.max(0, Number(len) || 0);
    if (!n) return '密码：（空）';
    return '密码：' + '•'.repeat(Math.min(12, Math.max(6, n)));
  }
  function strengthLabel(pwd) {
    pwd = String(pwd || '');
    if (!pwd) return ['', ''];
    const n = pwd.length;
    let classes = 0;
    if (/[a-z]/.test(pwd)) classes++;
    if (/[A-Z]/.test(pwd)) classes++;
    if (/[0-9]/.test(pwd)) classes++;
    if (/[^0-9A-Za-z]/.test(pwd)) classes++;
    let score = 0;
    if (n >= 8) score++;
    if (n >= 12) score++;
    if (classes >= 2) score++;
    if (classes >= 3) score++;
    if (classes >= 4 && n >= 12) score++;
    score = Math.max(0, Math.min(4, score));
    const labels = ['很弱', '弱', '中', '强', '很强'];
    return [labels[score], 's' + score];
  }
  function updateStrength() {
    const el = document.getElementById('f-strength');
    if (!el) return;
    const [label, cls] = strengthLabel(document.getElementById('f-pass').value);
    el.textContent = label ? ('密码强度：' + label) : '';
    el.className = cls;
  }
  function filtered() {
    const q = (document.getElementById('search').value || '').trim().toLowerCase();
    let items = state.items || [];
    if (!q) return items;
    return items.filter((it) => {
      const blob = ((it.title||'')+' '+(it.username||'')+' '+(it.url||'')+' '+(it.note||'')).toLowerCase();
      return blob.indexOf(q) >= 0;
    });
  }
  function render() {
    document.getElementById('user').textContent = state.logged_in
      ? (state.session || '已登录') : '未登录';
    const authBtn = document.getElementById('btn-auth');
    if (authBtn) authBtn.textContent = state.logged_in ? '退出' : '登录';
    const regBtn = document.getElementById('btn-register');
    if (regBtn) regBtn.style.display = state.logged_in ? 'none' : '';
    document.getElementById('status').textContent =
      state.status || (state.logged_in ? '共 0 条 · 已同步' : '未登录');
    const box = document.getElementById('list');
    const items = filtered();
    if (!items.length) {
      const tip = document.getElementById('search').value
        ? '（无匹配）'
        : (state.logged_in ? '暂无账号' : '未登录 — 点击「登录」同步云端账号');
      box.innerHTML = '<div id="empty">' + tip + '</div>';
      return;
    }
    box.innerHTML = '';
    const q = (document.getElementById('search').value || '').trim();
    items.forEach((it) => {
      const i = it.index;
      const row = document.createElement('div');
      row.className = 'row' + (it.pinned ? ' pinned' : '');
      row.dataset.index = String(i);
      row.dataset.pinned = it.pinned ? '1' : '0';
      const url = it.url || '';
      const user = it.username || '';
      const note = it.note || '';
      const canDrag = !q;
      row.innerHTML =
        (canDrag ? '<div class="grip" draggable="true" title="拖动排序">⋮⋮</div>' : '') +
        '<div class="row-top" style="padding-left:' + (canDrag ? '16' : '0') + 'px">' +
        '<button type="button" class="pin-btn' + (it.pinned ? ' on' : '') +
        '" data-pin="' + i + '" title="' + (it.pinned ? '取消置顶' : '置顶') + '">' +
        (it.pinned ? '★' : '☆') + '</button>' +
        '<div class="row-title">' + esc(it.title || '未命名') + '</div>' +
        '<button type="button" class="chip" data-edit="' + i + '" title="编辑此账号">编辑</button></div>' +
        '<div class="meta" data-copy-url="' + i + '" title="双击复制网址">' +
        esc(clipLine('网址', url)) + '</div>' +
        '<div class="meta" data-copy-user="' + i + '" title="双击复制账号">' +
        esc(clipLine('账号', user)) + '</div>' +
        '<div class="pass-row">' +
        '<div class="meta pass-text" data-copy-pass="' + i + '" title="双击复制密码">' +
        (state.plainShown[i] && state.revealed[i] != null
          ? esc('密码：' + state.revealed[i])
          : esc(maskPass(it.pass_len))) + '</div>' +
        '<button type="button" class="tbtn eye-btn" data-eye="' + i + '" title="' +
        (state.plainShown[i] ? '隐藏密码' : '显示密码') + '">' +
        (state.plainShown[i] ? '🙈' : '👁') + '</button>' +
        '<button type="button" class="tbtn" data-copy-pass="' + i + '" title="复制密码">复制</button>' +
        '</div>' +
        (note
          ? ('<div class="meta" data-copy-note="' + i + '" title="双击复制备注">' +
             esc(clipLine('备注', note)) + '</div>')
          : '') +
        '<div class="actions">' +
        '<button type="button" class="chip" data-edit="' + i + '">编辑</button>' +
        '<button type="button" class="chip danger" data-del="' + i + '" title="删除">删除</button>' +
        '</div>';
      if (canDrag) {
        const grip = row.querySelector('.grip');
        grip.addEventListener('dragstart', (ev) => {
          row.classList.add('dragging');
          ev.dataTransfer.setData('text/plain', String(i));
          ev.dataTransfer.effectAllowed = 'move';
        });
        grip.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', (ev) => {
          ev.preventDefault();
          const fromPinned = document.querySelector('.row.dragging');
          if (fromPinned && fromPinned.dataset.pinned !== row.dataset.pinned) {
            return;
          }
          row.classList.add('drag-over');
          ev.dataTransfer.dropEffect = 'move';
        });
        row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
        row.addEventListener('drop', (ev) => {
          ev.preventDefault();
          row.classList.remove('drag-over');
          const from = Number(ev.dataTransfer.getData('text/plain'));
          const to = i;
          if (Number.isFinite(from) && from !== to) {
            post({ type: 'action', id: 'reorder', from: from, to: to });
          }
        });
      }
      box.appendChild(row);
    });
  }
  function openForm(index) {
    state.editIndex = typeof index === 'number' ? index : -1;
    const it = state.editIndex >= 0
      ? (state.items.find((x) => x.index === state.editIndex) || {}) : {};
    document.getElementById('form-title').textContent =
      state.editIndex >= 0 ? '编辑账号' : '新建账号';
    document.getElementById('f-title').value = it.title || '';
    document.getElementById('f-user').value = it.username || '';
    document.getElementById('f-pass').value = '';
    document.getElementById('f-url').value = it.url || '';
    document.getElementById('f-note').value = it.note || '';
    document.getElementById('modal').classList.add('on');
    document.getElementById('f-title').focus();
    updateStrength();
  }
  function closeForm() {
    document.getElementById('modal').classList.remove('on');
    state.editIndex = -1;
  }
  function updatePassCell(index) {
    const row = document.querySelector('.row[data-index="' + index + '"]');
    if (!row) return;
    const txt = row.querySelector('.pass-text');
    const eye = row.querySelector('.eye-btn');
    const plain = !!state.plainShown[index];
    const it = state.items.find((x) => x.index === index);
    if (txt) {
      txt.textContent = (plain && state.revealed[index] != null)
        ? ('密码：' + state.revealed[index])
        : maskPass(it ? it.pass_len : 0);
    }
    if (eye) {
      eye.textContent = plain ? '🙈' : '👁';
      eye.title = plain ? '隐藏密码' : '显示密码';
    }
  }
  function togglePassPlain(index) {
    if (state.plainShown[index]) {
      state.plainShown[index] = false;
      updatePassCell(index);
    } else if (state.revealed[index] != null) {
      state.plainShown[index] = true;
      updatePassCell(index);
    } else {
      state.plainShown[index] = true;
      post({ type: 'action', id: 'reveal_pass', index: index });
    }
  }
  document.getElementById('hide').onclick = () => post({ type: 'action', id: 'hide' });
  document.getElementById('btn-refresh').onclick = () => post({ type: 'action', id: 'refresh' });
  document.getElementById('btn-add').onclick = () => openForm(-1);
  document.getElementById('btn-auth').onclick = () => {
    post({ type: 'action', id: state.logged_in ? 'logout' : 'login' });
  };
  document.getElementById('btn-sync').onclick = () => {
    post({ type: 'action', id: 'sync' });
  };
  document.getElementById('btn-register').onclick = () => {
    post({ type: 'action', id: 'register' });
  };
  document.getElementById('search').oninput = () => render();
  document.getElementById('f-cancel').onclick = () => closeForm();
  document.getElementById('f-pass').oninput = updateStrength;
  document.getElementById('f-ok').onclick = () => {
    post({
      type: 'action', id: 'save_entry',
      index: state.editIndex,
      title: document.getElementById('f-title').value,
      username: document.getElementById('f-user').value,
      password: document.getElementById('f-pass').value,
      url: document.getElementById('f-url').value,
      note: document.getElementById('f-note').value
    });
    closeForm();
  };
  document.getElementById('list').addEventListener('click', (ev) => {
    const t = ev.target;
    if (!(t instanceof HTMLElement)) return;
    const edit = t.getAttribute('data-edit');
    const del = t.getAttribute('data-del');
    const pin = t.getAttribute('data-pin');
    const cp = t.getAttribute('data-copy-pass');
    const eye = t.getAttribute('data-eye');
    if (edit != null) openForm(Number(edit));
    else if (del != null) post({ type: 'action', id: 'delete', index: Number(del) });
    else if (pin != null) post({ type: 'action', id: 'toggle_pin', index: Number(pin) });
    else if (eye != null && t.tagName === 'BUTTON') togglePassPlain(Number(eye));
    else if (cp != null && t.tagName === 'BUTTON') {
      post({ type: 'action', id: 'copy_pass', index: Number(cp) });
    }
  });
  document.getElementById('list').addEventListener('dblclick', (ev) => {
    const t = ev.target;
    if (!(t instanceof HTMLElement)) return;
    const cu = t.getAttribute('data-copy-user');
    const cp = t.getAttribute('data-copy-pass');
    const curl = t.getAttribute('data-copy-url');
    const cn = t.getAttribute('data-copy-note');
    if (cu != null) post({ type: 'action', id: 'copy_user', index: Number(cu) });
    else if (cp != null) post({ type: 'action', id: 'copy_pass', index: Number(cp) });
    else if (curl != null) post({ type: 'action', id: 'copy_url', index: Number(curl) });
    else if (cn != null) post({ type: 'action', id: 'copy_note', index: Number(cn) });
  });
  let drag = null;
  document.getElementById('title-bar').addEventListener('mousedown', (e) => {
    if (e.target && e.target.id === 'hide') return;
    drag = { x: e.screenX, y: e.screenY };
    post({ type: 'action', id: 'drag_begin', x: e.screenX, y: e.screenY });
  });
  window.addEventListener('mouseup', () => { drag = null; post({ type: 'action', id: 'drag_end' }); });
  window.addEventListener('mousemove', (e) => {
    if (!drag) return;
    post({ type: 'action', id: 'drag_move', x: e.screenX, y: e.screenY });
  });

  function applyState(msg) {
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'revealed_password' && typeof msg.index === 'number' && typeof msg.password === 'string') {
      state.revealed[msg.index] = msg.password;
      if (state.plainShown[msg.index]) {
        updatePassCell(msg.index);
      }
      return;
    }
    if (typeof msg.logged_in === 'boolean') state.logged_in = msg.logged_in;
    if (typeof msg.session === 'string') state.session = msg.session;
    if (typeof msg.status === 'string') state.status = msg.status;
    if (Array.isArray(msg.items)) state.items = msg.items;
    render();
  }
  window.applyState = applyState;
  try {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', (ev) => {
        let msg = ev.data;
        if (typeof msg === 'string') {
          try { msg = JSON.parse(msg); } catch (e) { return; }
        }
        applyState(msg);
      });
    }
  } catch (e) {}
  post({ type: 'ready' });
</script>
</body>
</html>
