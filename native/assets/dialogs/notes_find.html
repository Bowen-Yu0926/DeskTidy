<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>查找</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #2563eb; --primary-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px;
    background: rgba(15, 23, 42, 0.22); border-radius: 16px;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .title { font-size: 16px; font-weight: 800; margin: 0; }
  #close {
    width: 28px; height: 28px; border: none; background: transparent; color: var(--muted);
    font-size: 18px; border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: var(--accent-soft); color: var(--accent); }
  .card {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 3px solid var(--accent); padding: 14px 16px;
    box-shadow: 0 12px 28px rgba(26,35,50,0.12);
  }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .field input[type=text] {
    width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit;
  }
  .field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 12px 16px; margin: 12px 0 4px; color: var(--text); }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; }
  #status { min-height: 18px; margin-top: 8px; color: var(--muted); font-size: 12px; }
  .foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  #replace-field { display: none; }
  body.replace #replace-field { display: block; }
  body.replace #btn-replace, body.replace #btn-replace-all { display: inline-block; }
  #all-tabs-wrap { display: none; }
  body.replace #all-tabs-wrap { display: flex; }
  #btn-replace, #btn-replace-all { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div class="title-row">
    <h1 class="title" id="title">查找</h1>
    <button id="close" type="button" aria-label="关闭">×</button>
  </div>
  <div class="card">
    <div class="field">
      <label>查找内容</label>
      <input id="find" type="text" />
    </div>
    <div class="field" id="replace-field">
      <label>替换为</label>
      <input id="replace" type="text" />
    </div>
    <div class="opts">
      <label><input type="checkbox" id="case" /> 区分大小写</label>
      <label><input type="checkbox" id="word" /> 全字匹配</label>
      <label><input type="checkbox" id="regex" /> 正则表达式</label>
      <label><input type="checkbox" id="wrap" checked /> 循环查找</label>
      <label id="all-tabs-wrap"><input type="checkbox" id="all_tabs" /> 所有页签（全部替换）</label>
    </div>
    <div id="status"></div>
  </div>
  <div class="foot">
    <button class="btn" id="btn-prev">查找上一个</button>
    <button class="btn primary" id="btn-next">查找下一个</button>
    <button class="btn" id="btn-replace">替换</button>
    <button class="btn" id="btn-replace-all">全部替换</button>
    <button class="btn" id="btn-close">关闭</button>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function payload(id) {
    return {
      type: 'action', id,
      find: document.getElementById('find').value,
      replace: document.getElementById('replace').value,
      match_case: document.getElementById('case').checked,
      whole_word: document.getElementById('word').checked,
      regex: document.getElementById('regex').checked,
      wrap: document.getElementById('wrap').checked,
      all_tabs: document.getElementById('all_tabs').checked
    };
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.replace_mode) document.body.classList.add('replace');
    else document.body.classList.remove('replace');
    document.getElementById('title').textContent = m.replace_mode ? '替换' : '查找';
    if (typeof m.find === 'string') document.getElementById('find').value = m.find;
    if (typeof m.replace === 'string') document.getElementById('replace').value = m.replace;
    document.getElementById('case').checked = !!m.match_case;
    document.getElementById('word').checked = !!m.whole_word;
    document.getElementById('regex').checked = !!m.regex;
    document.getElementById('wrap').checked = m.wrap !== false;
    document.getElementById('all_tabs').checked = !!m.all_tabs;
    if (typeof m.status === 'string') document.getElementById('status').textContent = m.status;
    setTimeout(() => { const el = document.getElementById('find'); el.focus(); el.select(); }, 40);
  };
  document.getElementById('btn-next').onclick = () => post(payload('find_next'));
  document.getElementById('btn-prev').onclick = () => post(payload('find_prev'));
  document.getElementById('btn-replace').onclick = () => post(payload('replace'));
  document.getElementById('btn-replace-all').onclick = () => post(payload('replace_all'));
  document.getElementById('btn-close').onclick = () => post({ type: 'action', id: 'close' });
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'close' });
  document.getElementById('find').onkeydown = e => {
    if (e.key === 'Enter') post(payload(e.shiftKey ? 'find_prev' : 'find_next'));
    if (e.key === 'Escape') post({ type: 'action', id: 'close' });
  };
  document.getElementById('replace').onkeydown = e => {
    if (e.key === 'Enter') post(payload('replace'));
    if (e.key === 'Escape') post({ type: 'action', id: 'close' });
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
