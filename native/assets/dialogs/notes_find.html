<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>查找</title>
<style>
  /* DingTalk online-doc find panel: flat white surface, hairline border,
     no drop shadow stack, secondary buttons with one primary action. */
  :root {
    --card: #FFFFFF;
    --border: #E5E6EB;
    --border-strong: #D0D3D9;
    --text: #1F2329;
    --muted: #646A73;
    --faint: #8F959E;
    --hover: #F2F3F5;
    --primary: #1F6BFF;
    --primary-hover: #1A5FE0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%; padding: 10px;
    display: flex; flex-direction: column;
  }
  #card {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .title { margin: 0; font-size: 14px; font-weight: 600; color: var(--text); }
  #close {
    width: 24px; height: 24px; border: none; background: transparent;
    color: var(--faint); font-size: 16px; line-height: 1; cursor: pointer;
    border-radius: 4px; padding: 0;
  }
  #close:hover { background: var(--hover); color: var(--text); }

  /* Input row: search glyph inside, arrows on the right (DingTalk layout). */
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .box {
    flex: 1; min-width: 0; position: relative;
    display: flex; align-items: center;
    height: 32px; padding: 0 8px 0 28px;
    border: 1px solid var(--border); border-radius: 6px;
    background: #fff;
  }
  .box:focus-within { border-color: var(--primary); }
  .box svg {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--faint); pointer-events: none;
  }
  .box input {
    flex: 1; min-width: 0; height: 100%;
    border: none; outline: none; background: transparent;
    font: inherit; color: var(--text); padding: 0;
  }
  .box input::placeholder { color: var(--faint); }

  .nav { display: flex; gap: 2px; flex-shrink: 0; }
  .icon-btn {
    width: 28px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; border-radius: 6px;
    color: var(--muted); cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }

  .opts {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin: 2px 0 0;
  }
  /* Option chips: a quiet toggle, not a checkbox row. */
  .chip {
    display: inline-flex; align-items: center;
    height: 24px; padding: 0 8px;
    border-radius: 4px; color: var(--muted);
    font-size: 12px; line-height: 1; cursor: pointer;
    user-select: none; white-space: nowrap;
  }
  .chip:hover { background: var(--hover); }
  .chip input { position: absolute; opacity: 0; width: 0; height: 0; }
  .chip.on { background: #E8F0FF; color: var(--primary); }

  #status {
    min-height: 16px; margin-top: 6px;
    font-size: 12px; color: var(--faint);
  }

  .foot {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: flex-end; margin-top: auto; padding-top: 8px;
  }
  .btn {
    height: 28px; padding: 0 12px;
    border: 1px solid var(--border-strong); border-radius: 4px;
    background: #fff; color: var(--text);
    font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }

  #replace-row { display: none; }
  body.replace #replace-row { display: flex; }
  body.replace #btn-replace, body.replace #btn-replace-all { display: inline-block; }
  #all-tabs-wrap { display: none; }
  body.replace #all-tabs-wrap { display: inline-flex; }
  #btn-replace, #btn-replace-all { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <div class="head">
      <h1 class="title" id="title">查找</h1>
      <button id="close" type="button" aria-label="关闭">×</button>
    </div>

    <div class="row">
      <label class="box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="4.5"></circle>
          <path d="M10.5 10.5 14 14" stroke-linecap="round"></path>
        </svg>
        <input id="find" type="text" placeholder="查找内容" />
      </label>
      <div class="nav">
        <button class="icon-btn" id="btn-prev" type="button" title="查找上一个">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 10 8 6l4 4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="icon-btn" id="btn-next" type="button" title="查找下一个">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 6l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="row" id="replace-row">
      <label class="box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 5h8l-2-2M13 11H5l2 2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <input id="replace" type="text" placeholder="替换为" />
      </label>
    </div>

    <div class="opts">
      <label class="chip" id="chip-case"><input type="checkbox" id="case" />区分大小写</label>
      <label class="chip" id="chip-word"><input type="checkbox" id="word" />全字匹配</label>
      <label class="chip" id="chip-regex"><input type="checkbox" id="regex" />正则</label>
      <label class="chip on" id="chip-wrap"><input type="checkbox" id="wrap" checked />循环</label>
      <label class="chip" id="all-tabs-wrap"><input type="checkbox" id="all_tabs" />所有页签</label>
    </div>

    <div id="status"></div>

    <div class="foot">
      <button class="btn" id="btn-replace">替换</button>
      <button class="btn" id="btn-replace-all">全部替换</button>
      <button class="btn primary" id="btn-next2">查找下一个</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function payload(id) {
    return {
      type: 'action', id,
      find: document.getElementById('find').value,
      replace: document.getElementById('replace').value,
      match_case: document.getElementById('case').checked,
      whole_word: document.getElementById('word').checked,
      regex: document.getElementById('regex').checked,
      wrap: document.getElementById('wrap').checked,
      all_tabs: document.getElementById('all_tabs').checked
    };
  }

  // Chips mirror their checkbox so the toggle reads as pressed/unpressed.
  var chipPairs = [
    ['case', 'chip-case'], ['word', 'chip-word'], ['regex', 'chip-regex'],
    ['wrap', 'chip-wrap'], ['all_tabs', 'all-tabs-wrap']
  ];
  function syncChips() {
    chipPairs.forEach(function (p) {
      var box = document.getElementById(p[0]);
      var chip = document.getElementById(p[1]);
      if (box && chip) chip.classList.toggle('on', box.checked);
    });
  }
  chipPairs.forEach(function (p) {
    var box = document.getElementById(p[0]);
    if (box) box.addEventListener('change', syncChips);
  });

  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.replace_mode) document.body.classList.add('replace');
    else document.body.classList.remove('replace');
    document.getElementById('title').textContent = m.replace_mode ? '替换' : '查找';
    if (typeof m.find === 'string') document.getElementById('find').value = m.find;
    if (typeof m.replace === 'string') document.getElementById('replace').value = m.replace;
    document.getElementById('case').checked = !!m.match_case;
    document.getElementById('word').checked = !!m.whole_word;
    document.getElementById('regex').checked = !!m.regex;
    document.getElementById('wrap').checked = m.wrap !== false;
    document.getElementById('all_tabs').checked = !!m.all_tabs;
    if (typeof m.status === 'string') document.getElementById('status').textContent = m.status;
    syncChips();
    setTimeout(function () { var el = document.getElementById('find'); el.focus(); el.select(); }, 40);
  };

  document.getElementById('btn-next').onclick = function () { post(payload('find_next')); };
  document.getElementById('btn-next2').onclick = function () { post(payload('find_next')); };
  document.getElementById('btn-prev').onclick = function () { post(payload('find_prev')); };
  document.getElementById('btn-replace').onclick = function () { post(payload('replace')); };
  document.getElementById('btn-replace-all').onclick = function () { post(payload('replace_all')); };
  document.getElementById('close').onclick = function () { post({ type: 'action', id: 'close' }); };
  document.getElementById('find').onkeydown = function (e) {
    if (e.key === 'Enter') post(payload(e.shiftKey ? 'find_prev' : 'find_next'));
    if (e.key === 'Escape') post({ type: 'action', id: 'close' });
  };
  document.getElementById('replace').onkeydown = function (e) {
    if (e.key === 'Enter') post(payload('replace'));
    if (e.key === 'Escape') post({ type: 'action', id: 'close' });
  };
  try {
    chrome.webview.addEventListener('message', function (ev) {
      var m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch (e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
