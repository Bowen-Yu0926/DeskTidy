<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>录屏已保存</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #16A34A; --primary-hover: #15803D;
    --danger: #DC2626; --danger-soft: #FEE2E2;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: transparent;
  }
  #card {
    width: 100%; max-width: 440px; position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    border-left: 3px solid var(--primary); padding: 18px 18px 14px;
    box-shadow: 0 18px 40px rgba(26,35,50,0.18);
  }
  #close {
    position: absolute; top: 10px; right: 12px; width: 28px; height: 28px;
    border: none; background: transparent; color: var(--muted); font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: var(--accent-soft); color: var(--accent); }
  #title { margin: 0 28px 6px 0; font-size: 16px; font-weight: 800; }
  #hint { margin: 0 0 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  #folder {
    margin: 0 0 10px; color: var(--muted); font-size: 11px; line-height: 1.4;
    word-break: break-all;
  }
  #lab { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--text); }
  .row {
    display: flex; align-items: center; gap: 6px; margin-bottom: 14px;
  }
  #val {
    flex: 1; min-width: 0; height: 36px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 10px; font: inherit;
  }
  #val:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #ext {
    flex: 0 0 auto; color: var(--muted); font-size: 12px; font-weight: 700;
    padding-right: 2px;
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .btn.danger-ghost { color: var(--danger); border-color: #FECACA; }
  .btn.danger-ghost:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>
<div id="wrap">
  <div id="card">
    <button id="close" type="button" aria-label="关闭（保留）" title="关闭并保留">×</button>
    <h1 id="title">录屏已保存</h1>
    <p id="hint">可修改文件名后保留；丢弃将删除本次录像。关闭窗口也会保留。</p>
    <p id="folder"></p>
    <div id="lab">文件名</div>
    <div class="row">
      <input id="val" type="text" spellcheck="false" />
      <span id="ext">.mp4</span>
    </div>
    <div class="foot">
      <button class="btn danger-ghost" id="discard" type="button">丢弃</button>
      <button class="btn primary" id="keep" type="button">保留</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function focusVal() {
    const el = document.getElementById('val');
    if (!el) return;
    el.focus();
    el.select();
  }
  function stem() {
    return (document.getElementById('val').value || '').trim();
  }
  function keep() {
    const s = stem();
    if (!s) {
      focusVal();
      return;
    }
    post({ type: 'action', id: 'keep', value: s });
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('title').textContent = m.title;
    if (m.hint) document.getElementById('hint').textContent = m.hint;
    document.getElementById('folder').textContent = m.folder || '';
    document.getElementById('val').value = m.value || '';
    document.getElementById('ext').textContent = m.ext || '.mp4';
    focusVal();
    setTimeout(focusVal, 50);
    setTimeout(focusVal, 160);
  };
  document.getElementById('keep').onclick = keep;
  document.getElementById('discard').onclick = () => post({ type: 'action', id: 'discard' });
  // Help contract: Esc / × keep the file (same as 保留 with current name).
  document.getElementById('close').onclick = keep;
  document.getElementById('val').onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); keep(); }
    if (e.key === 'Escape') { e.preventDefault(); keep(); }
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
