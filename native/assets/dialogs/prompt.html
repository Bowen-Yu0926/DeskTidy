<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>输入</title>
<style>
  :root {
    --card: rgba(18, 24, 38, 0.94);
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(255, 255, 255, 0.24);
    --text: #F8FAFC;
    --muted: #94A3B8;
    --accent: #3B82F6;
    --accent-hover: #60A5FA;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: transparent;
  }
  #card {
    width: 100%; max-width: 380px; position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: mistIn 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border: none; background: transparent; color: #94A3B8; font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
    transition: all 120ms ease;
  }
  #close:hover { background: rgba(255, 255, 255, 0.10); color: #FFFFFF; }
  #title {
    margin: 0 28px 8px 0; font-size: 16px; font-weight: 700; color: var(--text);
    line-height: 1.35;
  }
  #label {
    margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  #val {
    width: 100%; height: 36px; padding: 0 12px; margin-bottom: 18px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    color: #F8FAFC; background: rgba(0, 0, 0, 0.28);
    transition: all 120ms ease;
  }
  #val:focus {
    outline: none;
    border-color: #3B82F6;
    background: rgba(0, 0, 0, 0.40);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--border); background: rgba(255, 255, 255, 0.06); border-radius: 8px;
    min-width: 76px; min-height: 32px; padding: 6px 15px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    cursor: pointer;
    transition: all 120ms ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--border-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px #0F172A, 0 0 0 4px rgba(59, 130, 246, 0.6);
  }
  .btn.primary {
    background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
    border-color: rgba(96, 165, 250, 0.4);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
  }
  .btn.primary:hover {
    background: linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title">
    <button id="close" type="button" aria-label="关闭">×</button>
    <h1 id="title">输入</h1>
    <p id="label"></p>
    <input id="val" type="text" />
    <div class="foot">
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="ok">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function focusVal() {
    const el = document.getElementById('val');
    if (!el) return;
    el.focus();
    el.select();
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('title').textContent = m.title;
    document.getElementById('label').textContent = m.label || '';
    document.getElementById('val').value = m.value || '';
    // Host MoveFocus + retries: WebView2 often ignores the first focus().
    focusVal();
    setTimeout(focusVal, 50);
    setTimeout(focusVal, 160);
  };
  document.getElementById('ok').onclick = () => {
    post({ type: 'action', id: 'ok', value: document.getElementById('val').value });
  };
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('val').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('ok').click();
    if (e.key === 'Escape') document.getElementById('cancel').click();
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
