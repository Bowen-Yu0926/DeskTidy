<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>输入</title>
<style>
  /* DingTalk-flavoured light surface — same token set as confirm.html. */
  :root {
    --card: #FFFFFF;
    --border: #E5E6EB;
    --border-hover: #D0D3D9;
    --text: #1F2329;
    --muted: #646A73;
    --faint: #8F959E;
    --hover: #F2F3F5;
    --accent: #1F6BFF;
    --accent-hover: #1A5FE0;
    --accent-soft: #E8F0FF;
    --primary: #1F6BFF;
    --primary-hover: #1A5FE0;
    --shadow: 0 8px 24px rgba(31, 35, 41, 0.12), 0 0 0 1px rgba(31, 35, 41, 0.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: transparent;
  }
  #card {
    width: 100%; max-width: 380px; position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px 20px 16px;
    box-shadow: var(--shadow);
    animation: mistIn 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 10px; right: 10px; width: 24px; height: 24px;
    border: none; background: transparent; color: var(--faint); font-size: 16px;
    border-radius: 4px; cursor: pointer; line-height: 1;
    transition: all 120ms ease;
  }
  #close:hover { background: var(--hover); color: var(--text); }
  #title {
    margin: 0 24px 8px 0; font-size: 15px; font-weight: 600; color: var(--text);
    line-height: 1.4;
  }
  #label {
    margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.6;
  }
  #val {
    width: 100%; height: 32px; padding: 0 10px; margin-bottom: 18px;
    border: 1px solid var(--border-hover); border-radius: 4px; font: inherit;
    color: var(--text); background: #fff;
    transition: all 120ms ease;
  }
  #val:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(31, 107, 255, 0.15);
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--border-hover); background: #fff; border-radius: 4px;
    min-width: 68px; min-height: 30px; padding: 5px 14px;
    font: inherit; font-size: 13px; font-weight: 400; color: var(--text);
    cursor: pointer;
    transition: all 120ms ease;
  }
  .btn:hover { background: var(--hover); }
  .btn:active { transform: scale(0.98); }
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px rgba(31, 107, 255, 0.35);
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #FFFFFF;
  }
  .btn.primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title">
    <button id="close" type="button" aria-label="关闭">×</button>
    <h1 id="title">输入</h1>
    <p id="label"></p>
    <input id="val" type="text" />
    <div class="foot">
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="ok">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function focusVal() {
    const el = document.getElementById('val');
    if (!el) return;
    el.focus();
    el.select();
  }
  window.applyState = function(m) {
    if (!m) return;
    // Host asks to restore caret after empty OK / IME glitch.
    if (m.type === 'focus') {
      focusVal();
      setTimeout(focusVal, 40);
      return;
    }
    if (m.type !== 'state') return;
    if (m.title) document.getElementById('title').textContent = m.title;
    document.getElementById('label').textContent = m.label || '';
    document.getElementById('val').value = m.value || '';
    // Host MoveFocus + retries: WebView2 often ignores the first focus().
    focusVal();
    setTimeout(focusVal, 50);
    setTimeout(focusVal, 160);
  };
  document.getElementById('ok').onclick = () => {
    post({ type: 'action', id: 'ok', value: document.getElementById('val').value });
  };
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('val').onkeydown = e => {
    // Explorer/IME: Enter while composing only commits the candidate — must
    // NOT submit the dialog, or caret dies and only number keys still work.
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('ok').click();
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      document.getElementById('cancel').click();
    }
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
