<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>输入</title>
<style>
  :root {
    --card: #ffffff;
    --border: #d0d7e2;
    --text: #1a1f27;
    --muted: #4b5563;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --shadow: 0 16px 40px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.06);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: transparent;
  }
  #card {
    width: 100%; max-width: 380px; position: relative;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    animation: mistIn 140ms ease-out;
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(4px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
    border: none; background: transparent; color: #6b7280; font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: #f3f4f6; color: var(--text); }
  #title {
    margin: 0 28px 8px 0; font-size: 16px; font-weight: 700; color: var(--text);
    line-height: 1.35;
  }
  #label {
    margin: 0 0 10px; color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  #val {
    width: 100%; height: 34px; padding: 0 11px; margin-bottom: 16px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    color: var(--text); background: #fff;
  }
  #val:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 8px;
    min-width: 76px; min-height: 32px; padding: 6px 14px;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    cursor: pointer;
  }
  .btn:hover { background: #f3f4f6; border-color: #b8c0cc; }
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(37, 99, 235, 0.45);
  }
  .btn.primary {
    background: var(--primary); border-color: var(--primary); color: #fff;
  }
  .btn.primary:hover {
    background: var(--primary-hover); border-color: var(--primary-hover); color: #fff;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title">
    <button id="close" type="button" aria-label="关闭">×</button>
    <h1 id="title">输入</h1>
    <p id="label"></p>
    <input id="val" type="text" />
    <div class="foot">
      <button class="btn" id="cancel">取消</button>
      <button class="btn primary" id="ok">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function focusVal() {
    const el = document.getElementById('val');
    if (!el) return;
    el.focus();
    el.select();
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('title').textContent = m.title;
    document.getElementById('label').textContent = m.label || '';
    document.getElementById('val').value = m.value || '';
    // Host MoveFocus + retries: WebView2 often ignores the first focus().
    focusVal();
    setTimeout(focusVal, 50);
    setTimeout(focusVal, 160);
  };
  document.getElementById('ok').onclick = () => {
    post({ type: 'action', id: 'ok', value: document.getElementById('val').value });
  };
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('val').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('ok').click();
    if (e.key === 'Escape') document.getElementById('cancel').click();
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
