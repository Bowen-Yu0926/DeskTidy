<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>整理白名单</title>
<style>
  :root {
    --bg: #F5F6F7; --card: #FFFFFF; --border: #E5E6EB; --text: #1F2329;
    --muted: #646A73; --accent: #1F6BFF; --accent-soft: #E8F0FF;
    --primary: #1F6BFF; --primary-hover: #1A5FE0; --danger: #D83931; --row: #F5F6F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px;
  }
  .head { margin-bottom: 10px; }
  .title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .hint { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .panel {
    flex: 1; min-height: 0; display: flex; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; overflow: hidden;
  }
  #list {
    flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px;
  }
  .item {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--row); cursor: pointer; font-family: Consolas, "Cascadia Mono", monospace;
  }
  .item:hover { background: #F2F3F5; }
  .item.sel { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; color: #1F2329; }
  .side { width: 108px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
    padding: 8px 10px; font: inherit; font-weight: 400; cursor: pointer; color: var(--text);
  }
  .btn:hover { background: #F2F3F5; border-color: #D0D3D9; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); border-color: #F5C6C2; }
  .btn.danger:hover { background: #FEF2F2; }
  .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 8px; }
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(31,35,41,0.12);
    align-items: center; justify-content: center; z-index: 5;
  }
  #modal.on { display: flex; }
  #form {
    width: min(360px, 92%); background: #fff; border-radius: 12px;
    border: 1px solid var(--border); padding: 14px;
    box-shadow: 0 12px 32px rgba(31,35,41,0.12);
  }
  #form h3 { margin: 0 0 8px; font-size: 15px; }
  #form p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  #form input {
    width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit; margin-bottom: 12px;
  }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="wrap">
  <div class="head">
    <h1 class="title">整理白名单</h1>
    <p class="hint">一键整理 / 自动监视时会跳过名单中的文件名（支持一个 * 通配）。</p>
  </div>
  <div class="panel">
    <div id="list"></div>
    <div class="side">
      <button class="btn" id="add">添加</button>
      <button class="btn" id="edit">编辑</button>
      <button class="btn danger" id="del">删除</button>
    </div>
  </div>
  <div class="foot">
    <button class="btn" id="cancel">取消</button>
    <button class="btn primary" id="save">保存</button>
  </div>
</div>
<div id="modal">
  <div id="form">
    <h3 id="form-title">添加</h3>
    <p>文件名或通配（如 report*.pdf）</p>
    <input id="form-val" type="text" />
    <div class="form-actions">
      <button class="btn" id="form-cancel">取消</button>
      <button class="btn primary" id="form-ok">确定</button>
    </div>
  </div>
</div>
<script>
  let items = [];
  let sel = -1;
  let editMode = false;

  function post(msg) {
    const s = JSON.stringify(msg);
    try { chrome.webview.postMessage(s); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">暂无条目</div>';
      return;
    }
    list.innerHTML = items.map((n, i) =>
      `<div class="item${i===sel?' sel':''}" data-i="${i}">${esc(n)}</div>`).join('');
    list.querySelectorAll('.item').forEach(el => {
      el.onclick = () => { sel = +el.dataset.i; render(); };
      el.ondblclick = () => openForm(true);
    });
  }
  function openForm(edit) {
    editMode = !!edit;
    if (edit && (sel < 0 || sel >= items.length)) return;
    document.getElementById('form-title').textContent = edit ? '编辑' : '添加';
    document.getElementById('form-val').value = edit ? items[sel] : '';
    document.getElementById('modal').classList.add('on');
    setTimeout(() => document.getElementById('form-val').focus(), 30);
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    items = Array.isArray(m.items) ? m.items.slice() : [];
    if (sel >= items.length) sel = items.length ? 0 : -1;
    render();
  };
  document.getElementById('add').onclick = () => openForm(false);
  document.getElementById('edit').onclick = () => openForm(true);
  document.getElementById('del').onclick = () => {
    if (sel < 0 || sel >= items.length) return;
    post({ type: 'action', id: 'del', index: sel });
  };
  document.getElementById('save').onclick = () => post({ type: 'action', id: 'save' });
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('form-cancel').onclick = () => document.getElementById('modal').classList.remove('on');
  document.getElementById('form-ok').onclick = () => {
    const v = document.getElementById('form-val').value.trim();
    if (!v) return;
    document.getElementById('modal').classList.remove('on');
    if (editMode) post({ type: 'action', id: 'edit', index: sel, value: v });
    else post({ type: 'action', id: 'add', value: v });
  };
  document.getElementById('form-val').onkeydown = e => {
    if (e.key === 'Enter') document.getElementById('form-ok').click();
    if (e.key === 'Escape') document.getElementById('form-cancel').click();
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
