<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>选择</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #16A34A; --primary-hover: #15803D; --row: #F8FAFC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px;
    background: rgba(15, 23, 42, 0.22); border-radius: 16px;
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px; }
  .title { font-size: 16px; font-weight: 800; margin: 0; }
  #close {
    width: 28px; height: 28px; border: none; background: transparent; color: var(--muted);
    font-size: 18px; border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: var(--accent-soft); color: var(--accent); }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.4; word-break: break-all; }
  .panel {
    flex: 1; min-height: 0; display: flex; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 3px solid var(--accent); padding: 12px; overflow: hidden;
    box-shadow: 0 12px 28px rgba(26,35,50,0.12);
  }
  #list { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .item {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--row); cursor: pointer; font-weight: 600;
  }
  .item:hover { background: var(--accent-soft); }
  .item.sel { background: var(--accent-soft); border-color: var(--accent); color: #1E3A8A; font-weight: 800; }
  .side { width: 108px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .foot { display: flex; gap: 8px; justify-content: space-between; align-items: center; margin-top: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 8px; }
  #btn-new { display: none; }
  .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 3px; word-break: break-all; }
  #case-row { display: none; align-items: center; gap: 6px; font-size: 12px; color: var(--text); font-weight: 600; }
  #foot-btns { display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="title-row">
    <h1 class="title" id="title">选择</h1>
    <button id="close" type="button" aria-label="关闭">×</button>
  </div>
  <p class="hint" id="hint"></p>
  <div class="panel">
    <div id="list"></div>
    <div class="side">
      <button class="btn primary" id="btn-open">打开</button>
      <button class="btn" id="btn-new">新建…</button>
    </div>
  </div>
  <div class="foot">
    <label id="case-row"><input type="checkbox" id="case-toggle" /> 区分大小写</label>
    <span id="foot-btns">
      <button class="btn" id="cancel">取消</button>
    </span>
  </div>
</div>
<script>
  let items = [];
  let subs = [];
  let sel = 0;
  let allowNew = false;
  let openLabel = '打开';
  let caseToggle = false;

  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    document.getElementById('btn-open').textContent = openLabel;
    document.getElementById('btn-new').style.display = allowNew ? 'block' : 'none';
    document.getElementById('case-row').style.display = caseToggle ? 'flex' : 'none';
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">暂无条目</div>';
      return;
    }
    list.innerHTML = items.map((n, i) => {
      const sub = (subs && subs[i]) ? `<span class="sub">${esc(subs[i])}</span>` : '';
      return `<div class="item${i===sel?' sel':''}" data-i="${i}">${esc(n)}${sub}</div>`;
    }).join('');
    list.querySelectorAll('.item').forEach(el => {
      el.onclick = () => { sel = +el.dataset.i; render(); };
      el.ondblclick = () => document.getElementById('btn-open').click();
    });
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    if (m.title) document.getElementById('title').textContent = m.title;
    document.getElementById('hint').textContent = m.hint || '';
    items = Array.isArray(m.items) ? m.items.slice() : [];
    subs = Array.isArray(m.subs) ? m.subs.slice() : [];
    allowNew = !!m.allow_new;
    openLabel = m.open_label || '打开';
    caseToggle = !!m.case_toggle;
    document.getElementById('case-toggle').checked = !!m.case_on;
    if (typeof m.sel === 'number') sel = m.sel;
    if (sel < 0) sel = 0;
    if (sel >= items.length) sel = items.length ? 0 : -1;
    render();
  };
  document.getElementById('btn-open').onclick = () => {
    if (sel < 0) return;
    post({ type: 'action', id: 'open', index: sel });
  };
  document.getElementById('btn-new').onclick = () => post({ type: 'action', id: 'new' });
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('case-toggle').onchange = (ev) => {
    post({ type: 'action', id: 'toggle_case', value: ev.target.checked });
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') post({ type: 'action', id: 'cancel' });
  });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
