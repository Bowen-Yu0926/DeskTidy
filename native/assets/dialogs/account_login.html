<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>在线笔记账号</title>
<style>
  :root {
    --card: #FFFFFF;
    --border: #E5E6EB;
    --border-hover: #D0D3D9;
    --text: #1F2329;
    --muted: #646A73;
    --faint: #8F959E;
    --hover: #F2F3F5;
    --primary: #1F6BFF;
    --primary-hover: #1A5FE0;
    --danger: #D83931;
    --danger-soft: #FDECEC;
    --shadow: 0 8px 24px rgba(31,35,41,.12), 0 0 0 1px rgba(31,35,41,.04);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: transparent;
  }
  #card {
    width: 100%; max-width: 360px; position: relative;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 24px 24px 20px;
    box-shadow: var(--shadow);
    animation: mistIn 160ms cubic-bezier(0.16,1,0.3,1);
  }
  @keyframes mistIn {
    from { opacity:0; transform:translateY(8px) scale(.96); }
    to   { opacity:1; transform:none; }
  }
  #close {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px; border: none;
    background: transparent; color: var(--faint); font-size: 16px;
    border-radius: 4px; cursor: pointer; line-height: 1;
    transition: all 120ms;
  }
  #close:hover { background: var(--hover); color: var(--text); }

  /* Tab switcher */
  .tabs {
    display: flex; gap: 0; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 8px 0; font-size: 13px; font-weight: 500;
    color: var(--muted); background: none; border: none;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; transition: all 120ms;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover:not(.active) { color: var(--text); }

  /* Form fields */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; margin-bottom: 5px;
    font-size: 12px; color: var(--muted); font-weight: 500;
  }
  .field input {
    width: 100%; height: 34px; padding: 0 10px;
    border: 1px solid var(--border-hover); border-radius: 4px;
    font: inherit; color: var(--text); background: #fff;
    transition: all 120ms;
  }
  .field input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(31,107,255,.15);
  }
  .field input.error { border-color: var(--danger); }
  .field input.error:focus { box-shadow: 0 0 0 2px rgba(216,57,49,.15); }

  /* Error banner */
  #error-box {
    display: none; margin-bottom: 14px;
    padding: 8px 12px; border-radius: 4px;
    background: var(--danger-soft); color: var(--danger);
    font-size: 12px; line-height: 1.5;
  }
  #error-box.show { display: block; }

  /* Submit */
  #submit {
    width: 100%; height: 34px; margin-top: 4px;
    background: var(--primary); border: none; border-radius: 4px;
    color: #fff; font: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: all 120ms;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #submit:hover { background: var(--primary-hover); }
  #submit:active { transform: scale(.98); }
  #submit:disabled { opacity: .55; cursor: default; transform: none; }

  /* Spinner */
  .spin {
    display: none; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #submit.loading .spin { display: block; }

  /* Register extra field */
  #field-display { display: none; }
  body.register #field-display { display: block; }
</style>
</head>
<body class="login">
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true">
    <button id="close" type="button" aria-label="关闭">×</button>

    <div class="tabs">
      <button class="tab active" id="tab-login" type="button">登录</button>
      <button class="tab" id="tab-register" type="button">注册</button>
    </div>

    <div id="error-box"></div>

    <div class="field" id="field-display">
      <label for="inp-display">昵称</label>
      <input id="inp-display" type="text" placeholder="显示名称" autocomplete="nickname" />
    </div>
    <div class="field">
      <label for="inp-login">用户名</label>
      <input id="inp-login" type="text" placeholder="请输入用户名" autocomplete="username" />
    </div>
    <div class="field">
      <label for="inp-pass">密码</label>
      <input id="inp-pass" type="password" placeholder="请输入密码" autocomplete="current-password" />
    </div>

    <button id="submit" type="button">
      <span class="spin"></span>
      <span id="submit-label">登录</span>
    </button>
  </div>
</div>
<script>
  'use strict';
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch(e) {}
  }

  let mode = 'login'; // 'login' | 'register'
  let busy = false;

  function setMode(m) {
    mode = m;
    document.body.className = m;
    document.getElementById('tab-login').classList.toggle('active', m === 'login');
    document.getElementById('tab-register').classList.toggle('active', m === 'register');
    document.getElementById('submit-label').textContent = m === 'login' ? '登录' : '注册';
    document.getElementById('inp-pass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
    clearError();
    // Focus username or display
    setTimeout(() => {
      (m === 'register' ? document.getElementById('inp-display') : document.getElementById('inp-login')).focus();
    }, 30);
  }

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.classList.add('show');
  }
  function clearError() {
    document.getElementById('error-box').classList.remove('show');
    document.querySelectorAll('input.error').forEach(el => el.classList.remove('error'));
  }

  function setBusy(b) {
    busy = b;
    const btn = document.getElementById('submit');
    btn.disabled = b;
    btn.classList.toggle('loading', b);
  }

  function submit() {
    if (busy) return;
    clearError();
    const login = document.getElementById('inp-login').value.trim();
    const pass  = document.getElementById('inp-pass').value;

    if (!login) {
      document.getElementById('inp-login').classList.add('error');
      document.getElementById('inp-login').focus();
      showError('请输入用户名。');
      return;
    }
    if (!pass) {
      document.getElementById('inp-pass').classList.add('error');
      document.getElementById('inp-pass').focus();
      showError('请输入密码。');
      return;
    }

    if (mode === 'login') {
      setBusy(true);
      post({ type: 'action', id: 'login', login, pass });
    } else {
      const display = document.getElementById('inp-display').value.trim();
      if (!display) {
        document.getElementById('inp-display').classList.add('error');
        document.getElementById('inp-display').focus();
        showError('请输入昵称。');
        return;
      }
      setBusy(true);
      post({ type: 'action', id: 'register', login, pass, display });
    }
  }

  // Handle host replies
  window.applyState = function(m) {
    if (!m) return;
    if (m.type === 'focus') {
      document.getElementById('inp-login').focus();
      return;
    }
    if (m.type === 'state') {
      if (m.mode) setMode(m.mode);
      return;
    }
    if (m.type === 'result') {
      setBusy(false);
      if (m.ok) {
        // Host will close the dialog; nothing needed here.
        return;
      }
      showError(m.error || (mode === 'login' ? '登录失败，请检查用户名和密码。' : '注册失败，请稍后重试。'));
      if (mode === 'login') {
        document.getElementById('inp-pass').select();
        document.getElementById('inp-pass').focus();
      }
    }
  };

  document.getElementById('tab-login').onclick    = () => setMode('login');
  document.getElementById('tab-register').onclick = () => setMode('register');
  document.getElementById('close').onclick = () => post({ type:'action', id:'cancel' });
  document.getElementById('submit').onclick = submit;

  // Enter key in any field triggers submit
  document.querySelectorAll('input').forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      if (e.key === 'Escape') { e.preventDefault(); post({ type:'action', id:'cancel' }); }
    });
  });

  // Tab key cycles between fields instead of leaving the form
  document.querySelectorAll('input').forEach((el, i, arr) => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const next = arr[(i + (e.shiftKey ? arr.length - 1 : 1)) % arr.length];
        if (next.closest('.field').style.display !== 'none') next.focus();
      }
    });
  });

  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data;
      if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch(e) {}

  post({ type: 'action', id: 'ready' });
  setTimeout(() => document.getElementById('inp-login').focus(), 80);
</script>
</body>
</html>
