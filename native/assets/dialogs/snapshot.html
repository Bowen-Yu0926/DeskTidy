<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理快照</title>
<style>
  :root {
    --bg: #F5F6F7; --card: #FFFFFF; --border: #E5E6EB; --text: #1F2329;
    --muted: #646A73; --accent: #1F6BFF; --accent-soft: #E8F0FF;
    --primary: #1F6BFF; --primary-hover: #1A5FE0; --danger: #D83931; --row: #F5F6F7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px; }
  .title { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .panel {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.15fr; gap: 12px;
  }
  .col {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; display: flex; flex-direction: column; min-height: 0;
  }
  .col h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  #list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .item {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--row); cursor: pointer; font-weight: 700;
  }
  .item:hover { background: #F2F3F5; }
  .item.sel { background: var(--accent-soft); border-color: var(--accent); color: #1F2329; }
  #preview {
    flex: 1; overflow: auto; white-space: pre-wrap; font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px; color: var(--muted); background: var(--row); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; line-height: 1.5;
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 6px;
    padding: 8px 14px; font: inherit; font-weight: 400; cursor: pointer;
  }
  .btn:hover { background: #F2F3F5; border-color: #D0D3D9; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); border-color: #F5C6C2; }
  #empty { color: var(--muted); text-align: center; padding: 36px 8px; }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="title">管理快照</h1>
  <div class="panel">
    <div class="col">
      <h3>快照列表</h3>
      <div id="list"></div>
    </div>
    <div class="col">
      <h3>预览</h3>
      <div id="preview">选择左侧快照查看详情</div>
    </div>
  </div>
  <div class="foot">
    <button class="btn danger" id="del">删除</button>
    <button class="btn" id="rename">重命名</button>
    <button class="btn" id="close">关闭</button>
    <button class="btn primary" id="restore">恢复</button>
  </div>
</div>
<script>
  let items = [];
  let sel = -1;

  function post(msg) {
    const s = JSON.stringify(msg);
    try { chrome.webview.postMessage(s); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">暂无快照</div>';
      document.getElementById('preview').textContent = '暂无快照';
      return;
    }
    list.innerHTML = items.map((it, i) =>
      `<div class="item${i===sel?' sel':''}" data-i="${i}">${esc(it.name)}</div>`).join('');
    list.querySelectorAll('.item').forEach(el => {
      el.onclick = () => {
        sel = +el.dataset.i;
        render();
        post({ type: 'action', id: 'select', index: sel });
      };
      el.ondblclick = () => document.getElementById('restore').click();
    });
    const cur = items[sel];
    document.getElementById('preview').textContent = cur && cur.preview ? cur.preview : '选择左侧快照查看详情';
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    items = Array.isArray(m.items) ? m.items.slice() : [];
    if (typeof m.sel === 'number') sel = m.sel;
    if (sel < 0 && items.length) sel = 0;
    if (sel >= items.length) sel = items.length ? 0 : -1;
    render();
  };
  document.getElementById('restore').onclick = () => {
    if (sel < 0) return;
    post({ type: 'action', id: 'restore', index: sel });
  };
  document.getElementById('del').onclick = () => {
    if (sel < 0) return;
    post({ type: 'action', id: 'delete', index: sel });
  };
  document.getElementById('rename').onclick = () => {
    if (sel < 0) return;
    post({ type: 'action', id: 'rename', index: sel });
  };
  document.getElementById('close').onclick = () => post({ type: 'action', id: 'close' });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
