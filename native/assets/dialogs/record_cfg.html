<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>录屏设置</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #2563eb; --primary-hover: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px; }
  .title { font-size: 16px; font-weight: 800; margin: 0 0 10px; }
  .card {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 3px solid var(--accent); padding: 14px 16px; overflow: auto;
  }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit; background: #fff;
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--accent-soft); border-color: var(--accent);
  }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; min-width: 0; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 12px; font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="title">录屏设置</h1>
  <div class="card">
    <div class="field">
      <label>帧率（FPS，15–60，默认 30）</label>
      <input id="fps" type="number" min="15" max="60" step="1" />
    </div>
    <div class="field">
      <label>自动停止秒数（0 = 手动停止）</label>
      <input id="sec" type="number" min="0" step="1" />
    </div>
    <div class="field">
      <label>输出目录（空 = 程序目录\录屏）</label>
      <div class="row">
        <input id="dir" type="text" />
        <button class="btn" id="browse">浏览…</button>
      </div>
    </div>
    <div class="field">
      <label>画质</label>
      <select id="quality">
        <option value="0">低</option>
        <option value="1">中</option>
        <option value="2">高</option>
      </select>
    </div>
    <div class="field">
      <label>麦克风（系统设备枚举，空 = 不录音）</label>
      <select id="mic"></select>
    </div>
  </div>
  <div class="foot">
    <button class="btn" id="cancel">取消</button>
    <button class="btn primary" id="save">保存</button>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  function fillMic(devices, selected) {
    var sel = document.getElementById('mic');
    sel.innerHTML = '';
    var none = document.createElement('option');
    none.value = '';
    none.textContent = '（不录音）';
    sel.appendChild(none);
    (devices || []).forEach(function (d) {
      var o = document.createElement('option');
      o.value = d;
      o.textContent = d;
      sel.appendChild(o);
    });
    sel.value = selected || '';
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    document.getElementById('fps').value = m.fps != null ? m.fps : 30;
    document.getElementById('sec').value = m.seconds != null ? m.seconds : 0;
    document.getElementById('dir').value = m.dir || '';
    document.getElementById('quality').value = String(m.quality != null ? m.quality : 1);
    fillMic(m.mics, m.mic);
  };
  document.getElementById('browse').onclick = () => post({ type: 'action', id: 'browse' });
  document.getElementById('save').onclick = () => {
    post({
      type: 'action', id: 'save',
      fps: parseInt(document.getElementById('fps').value || '30', 10) || 30,
      seconds: parseInt(document.getElementById('sec').value || '0', 10) || 0,
      dir: document.getElementById('dir').value,
      quality: parseInt(document.getElementById('quality').value, 10),
      mic: document.getElementById('mic').value
    });
  };
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      if (m && m.type === 'state') applyState(m);
      if (m && m.type === 'dir_picked') {
        document.getElementById('dir').value = m.path || '';
      }
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
