<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>整理规则</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #16A34A; --primary-hover: #15803D; --danger: #DC2626; --row: #F8FAFC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px;
  }
  #wrap { height: 100%; display: flex; flex-direction: column; padding: 14px 16px 12px; }
  .title { font-size: 16px; font-weight: 800; margin: 0 0 4px; }
  .hint { margin: 0 0 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .panel {
    flex: 1; min-height: 0; display: flex; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    border-left: 3px solid var(--accent); padding: 12px; overflow: hidden;
  }
  #list { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .item {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--row); cursor: pointer;
  }
  .item:hover { background: var(--accent-soft); }
  .item.sel { background: var(--accent-soft); border-color: var(--accent); }
  .pat { font-weight: 800; font-family: Consolas, "Cascadia Mono", monospace; }
  .arrow { color: var(--muted); margin: 0 6px; }
  .fence { color: #1E3A8A; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .side { width: 118px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 10px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.danger { color: var(--danger); border-color: #FECACA; }
  .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 8px; }
  #modal {
    display: none; position: fixed; inset: 0; background: rgba(26,35,50,0.28);
    align-items: center; justify-content: center; z-index: 5;
  }
  #modal.on { display: flex; }
  #form {
    width: min(380px, 92%); background: #fff; border-radius: 12px;
    border: 1px solid var(--border); padding: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.16);
  }
  #form h3 { margin: 0 0 10px; font-size: 15px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 10px; font: inherit; background: #fff;
  }
  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
</style>
</head>
<body>
<div id="wrap">
  <h1 class="title">整理规则</h1>
  <p class="hint">扩展名 / 通配 → 分区 id。保存后整理与监视立即生效。</p>
  <div class="panel">
    <div id="list"></div>
    <div class="side">
      <button class="btn" id="add">添加</button>
      <button class="btn" id="edit">编辑</button>
      <button class="btn danger" id="del">删除</button>
      <button class="btn" id="reset">恢复默认</button>
      <button class="btn" id="notepad">记事本…</button>
    </div>
  </div>
  <div class="foot">
    <button class="btn" id="cancel">取消</button>
    <button class="btn primary" id="save">保存</button>
  </div>
</div>
<div id="modal">
  <div id="form">
    <h3 id="form-title">添加规则</h3>
    <div class="field">
      <label>匹配模式（.pdf / kind:image / Invoice*）</label>
      <input id="f-pat" type="text" />
    </div>
    <div class="field">
      <label>分区</label>
      <select id="f-fence"></select>
    </div>
    <div class="form-actions">
      <button class="btn" id="form-cancel">取消</button>
      <button class="btn primary" id="form-ok">确定</button>
    </div>
  </div>
</div>
<script>
  let items = [];
  let fences = [];
  let sel = -1;
  let editMode = false;

  function post(msg) {
    const s = JSON.stringify(msg);
    try { chrome.webview.postMessage(s); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render() {
    const list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div id="empty">暂无规则</div>';
      return;
    }
    list.innerHTML = items.map((r, i) =>
      `<div class="item${i===sel?' sel':''}" data-i="${i}">
        <div><span class="pat">${esc(r.pattern)}</span><span class="arrow">→</span><span class="fence">${esc(r.fence)}</span></div>
        ${r.fence_title ? `<div class="meta">${esc(r.fence_title)}</div>` : ''}
      </div>`).join('');
    list.querySelectorAll('.item').forEach(el => {
      el.onclick = () => { sel = +el.dataset.i; render(); };
      el.ondblclick = () => openForm(true);
    });
  }
  function fillFences(selected) {
    const selEl = document.getElementById('f-fence');
    const opts = fences.length ? fences : [{ id: 'system_common', title: 'system_common' }];
    selEl.innerHTML = opts.map(f =>
      `<option value="${esc(f.id)}"${f.id===selected?' selected':''}>${esc(f.id)}${f.title && f.title!==f.id ? ' — '+esc(f.title) : ''}</option>`
    ).join('');
  }
  function openForm(edit) {
    editMode = !!edit;
    if (edit && (sel < 0 || sel >= items.length)) return;
    document.getElementById('form-title').textContent = edit ? '编辑规则' : '添加规则';
    document.getElementById('f-pat').value = edit ? items[sel].pattern : '';
    fillFences(edit ? items[sel].fence : (fences[0] && fences[0].id) || 'system_common');
    document.getElementById('modal').classList.add('on');
    setTimeout(() => document.getElementById('f-pat').focus(), 30);
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    items = Array.isArray(m.items) ? m.items.slice() : [];
    fences = Array.isArray(m.fences) ? m.fences.slice() : [];
    if (sel >= items.length) sel = items.length ? 0 : -1;
    render();
  };
  document.getElementById('add').onclick = () => openForm(false);
  document.getElementById('edit').onclick = () => openForm(true);
  document.getElementById('del').onclick = () => {
    if (sel < 0) return;
    post({ type: 'action', id: 'del', index: sel });
  };
  document.getElementById('reset').onclick = () => post({ type: 'action', id: 'reset' });
  document.getElementById('notepad').onclick = () => post({ type: 'action', id: 'notepad' });
  document.getElementById('save').onclick = () => post({ type: 'action', id: 'save' });
  document.getElementById('cancel').onclick = () => post({ type: 'action', id: 'cancel' });
  document.getElementById('form-cancel').onclick = () => document.getElementById('modal').classList.remove('on');
  document.getElementById('form-ok').onclick = () => {
    const pattern = document.getElementById('f-pat').value.trim();
    const fence = document.getElementById('f-fence').value;
    if (!pattern || !fence) return;
    document.getElementById('modal').classList.remove('on');
    if (editMode) post({ type: 'action', id: 'edit', index: sel, pattern, fence });
    else post({ type: 'action', id: 'add', pattern, fence });
  };
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
