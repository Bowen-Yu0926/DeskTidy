<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>确认</title>
<style>
  :root {
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --primary: #16a34a;
    --primary-hover: #15803d;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fef2f2;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --info-soft: #eff6ff;
    --shadow: 0 22px 48px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(15, 23, 42, 0.04);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: transparent;
  }
  #card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    box-shadow: var(--shadow);
    position: relative;
    animation: mistIn 160ms ease-out;
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px;
    border: none; background: transparent; color: #94a3b8; font-size: 18px;
    border-radius: 9px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: #f1f5f9; color: var(--text); }
  .head {
    display: flex; gap: 14px; align-items: flex-start;
    margin: 0 24px 14px 0;
  }
  .badge {
    flex: 0 0 auto;
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--info-soft); color: var(--accent);
    font-size: 18px; font-weight: 800;
  }
  body.warn .badge { background: var(--warn-soft); color: var(--warn); }
  body.danger .badge { background: var(--danger-soft); color: var(--danger); }
  .head-text { min-width: 0; flex: 1; padding-top: 2px; }
  #title {
    margin: 0 0 6px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
    line-height: 1.3;
  }
  #msg {
    margin: 0;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .foot {
    display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    margin-top: 20px; padding-top: 4px;
  }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 11px;
    min-width: 84px;
    padding: 9px 16px;
    font: inherit;
    font-weight: 650;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, color 120ms ease,
                transform 80ms ease;
  }
  .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover { background: var(--danger-hover); border-color: var(--danger-hover); color: #fff; }
  .btn.ghost { background: #f8fafc; }
  #btn-no, #btn-cancel { display: none; }
  /* Confirm: 确定/删除 + 取消（市面删除确认，不用「是/否」） */
  body.confirm #btn-cancel,
  body.ync #btn-no,
  body.ync #btn-cancel { display: inline-block; }
</style>
</head>
<body class="alert">
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="msg">
    <button id="close" type="button" aria-label="关闭">×</button>
    <div class="head">
      <div class="badge" id="badge" aria-hidden="true">i</div>
      <div class="head-text">
        <h1 id="title">提示</h1>
        <p id="msg"></p>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="btn-cancel">取消</button>
      <button class="btn" id="btn-no">否</button>
      <button class="btn primary" id="btn-yes">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  let mode = 'alert';
  function badgeGlyph(tone) {
    if (tone === 'danger') return '!';
    if (tone === 'warn') return '!';
    return 'i';
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    mode = m.mode || 'alert';
    const tone = m.tone || '';
    document.body.className = mode + (tone ? ' ' + tone : '');
    document.getElementById('badge').textContent = badgeGlyph(tone);
    document.getElementById('title').textContent = m.title || '提示';
    document.getElementById('msg').textContent = m.message || '';
    const yes = document.getElementById('btn-yes');
    const no = document.getElementById('btn-no');
    const cancel = document.getElementById('btn-cancel');
    const danger = !!m.danger || tone === 'danger';
    if (m.yes_label) {
      yes.textContent = m.yes_label;
    } else if (mode === 'alert') {
      yes.textContent = '确定';
    } else if (danger) {
      yes.textContent = '删除';
    } else {
      yes.textContent = '确定';
    }
    no.textContent = m.no_label || '否';
    cancel.textContent = m.cancel_label || '取消';
    yes.className = 'btn ' + (danger ? 'danger' : 'primary');
    cancel.className = 'btn ghost';
    setTimeout(function () {
      (danger ? cancel : yes).focus();
    }, 40);
  };
  function finish(id) { post({ type: 'action', id: id }); }
  document.getElementById('btn-yes').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'yes');
  };
  document.getElementById('btn-no').onclick = function () { finish('no'); };
  document.getElementById('btn-cancel').onclick = function () { finish('cancel'); };
  document.getElementById('close').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'cancel');
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('close').click();
    if (e.key === 'Enter') {
      const danger = document.body.classList.contains('danger');
      if (danger && mode === 'confirm') return; // Enter 不误删；需点红色按钮
      document.getElementById('btn-yes').click();
    }
  });
  try {
    chrome.webview.addEventListener('message', function (ev) {
      let m = ev.data;
      if (typeof m === 'string') {
        try { m = JSON.parse(m); } catch (e) { return; }
      }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
