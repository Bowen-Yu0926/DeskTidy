<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>确认</title>
<style>
  :root {
    --card: rgba(18, 24, 38, 0.94);
    --border: rgba(255, 255, 255, 0.12);
    --border-hover: rgba(255, 255, 255, 0.24);
    --text: #F8FAFC;
    --muted: #94A3B8;
    --accent: #3B82F6;
    --accent-hover: #60A5FA;
    --accent-soft: rgba(59, 130, 246, 0.15);
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --danger: #EF4444;
    --danger-hover: #DC2626;
    --danger-soft: rgba(239, 68, 68, 0.20);
    --warn: #F59E0B;
    --warn-soft: rgba(245, 158, 11, 0.20);
    --info: #3B82F6;
    --info-soft: rgba(59, 130, 246, 0.20);
    --shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: transparent;
  }
  #card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
    position: relative;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: mistIn 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(8px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
    border: none; background: transparent; color: #94A3B8; font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
    transition: all 120ms ease;
  }
  #close:hover { background: rgba(255, 255, 255, 0.10); color: #FFFFFF; }
  .head {
    display: flex; gap: 14px; align-items: flex-start;
    margin: 0 24px 0 0;
  }
  .badge {
    flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--info-soft); color: var(--info);
    margin-top: 1px;
    box-shadow: 0 0 16px var(--info-soft);
  }
  .badge svg { width: 20px; height: 20px; display: block; }
  body.warn .badge { background: var(--warn-soft); color: var(--warn); box-shadow: 0 0 16px var(--warn-soft); }
  body.danger .badge { background: var(--danger-soft); color: var(--danger); box-shadow: 0 0 16px var(--danger-soft); }
  .head-text { min-width: 0; flex: 1; }
  #title {
    margin: 0 0 6px; font-size: 16px; font-weight: 700; letter-spacing: 0;
    line-height: 1.35; color: var(--text);
  }
  #msg {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .foot {
    display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    margin-top: 20px;
  }
  .btn {
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    min-width: 76px;
    min-height: 32px;
    padding: 6px 15px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 120ms ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--border-hover); }
  .btn:active { transform: scale(0.98); }
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px #0F172A, 0 0 0 4px rgba(59, 130, 246, 0.6);
  }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--border);
    color: #CBD5E1;
  }
  .btn.ghost:hover {
    background: rgba(255, 255, 255, 0.10);
    color: #FFFFFF;
  }
  .btn.primary {
    background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
    border-color: rgba(96, 165, 250, 0.4);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
  }
  .btn.primary:hover {
    background: linear-gradient(135deg, #60A5FA 0%, #2563EB 100%);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.5);
  }
  .btn.danger {
    background: linear-gradient(135deg, #EF4444 0%, #B91C1C 100%);
    border-color: rgba(248, 113, 113, 0.4);
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
  }
  .btn.danger:hover {
    background: linear-gradient(135deg, #F87171 0%, #DC2626 100%);
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
  }
  #btn-no, #btn-cancel { display: none; }
  /* Confirm: 确定/删除 + 取消（市面删除确认，不用「是/否」） */
  body.confirm #btn-cancel,
  body.ync #btn-no,
  body.ync #btn-cancel { display: inline-block; }
</style>
</head>
<body class="alert">
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="msg">
    <button id="close" type="button" aria-label="关闭">×</button>
    <div class="head">
      <div class="badge" id="badge" aria-hidden="true"></div>
      <div class="head-text">
        <h1 id="title">提示</h1>
        <p id="msg"></p>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="btn-cancel">取消</button>
      <button class="btn" id="btn-no">否</button>
      <button class="btn primary" id="btn-yes">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  let mode = 'alert';
  function badgeSvg(tone) {
    // Compact Fluent-style glyphs (info / warn / danger).
    if (tone === 'danger' || tone === 'warn') {
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<path d="M12 8.2v5.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
        '<circle cx="12" cy="16.4" r="1.15" fill="currentColor"/>' +
        '</svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="2"/>' +
      '<path d="M12 10.6v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
      '<circle cx="12" cy="7.7" r="1.15" fill="currentColor"/>' +
      '</svg>';
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    mode = m.mode || 'alert';
    const tone = m.tone || '';
    document.body.className = mode + (tone ? ' ' + tone : '');
    document.getElementById('badge').innerHTML = badgeSvg(tone);
    document.getElementById('title').textContent = m.title || '提示';
    document.getElementById('msg').textContent = m.message || '';
    const yes = document.getElementById('btn-yes');
    const no = document.getElementById('btn-no');
    const cancel = document.getElementById('btn-cancel');
    const danger = !!m.danger || tone === 'danger';
    if (m.yes_label) {
      yes.textContent = m.yes_label;
    } else if (mode === 'alert') {
      yes.textContent = '确定';
    } else if (danger) {
      yes.textContent = '删除';
    } else {
      yes.textContent = '确定';
    }
    no.textContent = m.no_label || '否';
    cancel.textContent = m.cancel_label || '取消';
    yes.className = 'btn ' + (danger ? 'danger' : 'primary');
    cancel.className = 'btn ghost';
    setTimeout(function () {
      (danger ? cancel : yes).focus();
    }, 40);
  };
  function finish(id) { post({ type: 'action', id: id }); }
  document.getElementById('btn-yes').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'yes');
  };
  document.getElementById('btn-no').onclick = function () { finish('no'); };
  document.getElementById('btn-cancel').onclick = function () { finish('cancel'); };
  document.getElementById('close').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'cancel');
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('close').click();
    if (e.key === 'Enter') {
      const danger = document.body.classList.contains('danger');
      if (danger && mode === 'confirm') return; // Enter 不误删；需点红色按钮
      document.getElementById('btn-yes').click();
    }
  });
  try {
    chrome.webview.addEventListener('message', function (ev) {
      let m = ev.data;
      if (typeof m === 'string') {
        try { m = JSON.parse(m); } catch (e) { return; }
      }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
