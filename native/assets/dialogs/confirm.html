<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>确认</title>
<style>
  :root {
    --bg: #EEF1F6; --card: #FFFFFF; --border: #C9D2DE; --text: #1A2332;
    --muted: #64748B; --accent: #1D4ED8; --accent-soft: #E0E7FF;
    --primary: #16A34A; --primary-hover: #15803D;
    --danger: #DC2626; --danger-soft: #FEE2E2; --warn: #D97706;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
  }
  #wrap {
    height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 12px; background: rgba(15, 23, 42, 0.28);
  }
  #card {
    width: 100%; max-width: 420px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    border-left: 3px solid var(--accent); padding: 18px 18px 14px;
    box-shadow: 0 18px 40px rgba(26,35,50,0.18);
    position: relative;
  }
  body.warn #card { border-left-color: var(--warn); }
  body.danger #card { border-left-color: var(--danger); }
  #close {
    position: absolute; top: 10px; right: 12px; width: 28px; height: 28px;
    border: none; background: transparent; color: var(--muted); font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: var(--accent-soft); color: var(--accent); }
  #title { margin: 0 28px 8px 0; font-size: 16px; font-weight: 800; }
  #msg {
    margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
  }
  .foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--border); background: #fff; border-radius: 10px;
    padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-hover); color: #fff; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.danger:hover { filter: brightness(0.95); color: #fff; }
  #btn-no, #btn-cancel { display: none; }
  body.confirm #btn-no, body.ync #btn-no, body.ync #btn-cancel { display: inline-block; }
  body.alert #btn-yes { /* ok */ }
</style>
</head>
<body class="alert">
<div id="wrap">
  <div id="card">
    <button id="close" type="button" aria-label="关闭">×</button>
    <h1 id="title">提示</h1>
    <p id="msg"></p>
    <div class="foot">
      <button class="btn" id="btn-cancel">取消</button>
      <button class="btn" id="btn-no">否</button>
      <button class="btn primary" id="btn-yes">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  let mode = 'alert';
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    mode = m.mode || 'alert';
    document.body.className = mode + (m.tone ? ' ' + m.tone : '');
    document.getElementById('title').textContent = m.title || '提示';
    document.getElementById('msg').textContent = m.message || '';
    const yes = document.getElementById('btn-yes');
    const no = document.getElementById('btn-no');
    const cancel = document.getElementById('btn-cancel');
    yes.textContent = m.yes_label || (mode === 'alert' ? '确定' : '是');
    no.textContent = m.no_label || '否';
    cancel.textContent = m.cancel_label || '取消';
    yes.className = 'btn ' + (m.danger ? 'danger' : 'primary');
    setTimeout(() => yes.focus(), 40);
  };
  function finish(id) { post({ type: 'action', id: id }); }
  document.getElementById('btn-yes').onclick = () => finish(mode === 'alert' ? 'ok' : 'yes');
  document.getElementById('btn-no').onclick = () => finish('no');
  document.getElementById('btn-cancel').onclick = () => finish('cancel');
  document.getElementById('close').onclick = () => finish(mode === 'alert' ? 'ok' : 'cancel');
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('close').click();
    if (e.key === 'Enter') document.getElementById('btn-yes').click();
  });
  try {
    chrome.webview.addEventListener('message', ev => {
      let m = ev.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch(e) { return; } }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
