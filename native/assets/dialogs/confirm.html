<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>确认</title>
<style>
  :root {
    --card: #ffffff;
    --border: #d0d7e2;
    --text: #1a1f27;
    --muted: #4b5563;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --danger-soft: #fef2f2;
    --warn: #c2410c;
    --warn-soft: #fff7ed;
    --info: #2563eb;
    --info-soft: #eff6ff;
    --shadow: 0 16px 40px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.06);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "Microsoft YaHei", "微软雅黑", "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: transparent; color: var(--text); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: transparent;
  }
  #card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    position: relative;
    animation: mistIn 140ms ease-out;
  }
  @keyframes mistIn {
    from { opacity: 0; transform: translateY(4px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }
  #close {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
    border: none; background: transparent; color: #6b7280; font-size: 18px;
    border-radius: 8px; cursor: pointer; line-height: 1;
  }
  #close:hover { background: #f3f4f6; color: var(--text); }
  .head {
    display: flex; gap: 12px; align-items: flex-start;
    margin: 0 22px 0 0;
  }
  .badge {
    flex: 0 0 auto;
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--info-soft); color: var(--info);
    margin-top: 1px;
  }
  .badge svg { width: 18px; height: 18px; display: block; }
  body.warn .badge { background: var(--warn-soft); color: var(--warn); }
  body.danger .badge { background: var(--danger-soft); color: var(--danger); }
  .head-text { min-width: 0; flex: 1; }
  #title {
    margin: 0 0 6px; font-size: 16px; font-weight: 700; letter-spacing: 0;
    line-height: 1.35; color: var(--text);
  }
  #msg {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .foot {
    display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    margin-top: 18px;
  }
  .btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 8px;
    min-width: 76px;
    min-height: 32px;
    padding: 6px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: background 100ms ease, border-color 100ms ease, color 100ms ease,
                box-shadow 100ms ease;
  }
  .btn:hover { background: #f3f4f6; border-color: #b8c0cc; }
  .btn:active { background: #e5e7eb; }
  .btn:focus { outline: none; }
  .btn:focus-visible {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(37, 99, 235, 0.45);
  }
  .btn.ghost {
    background: #fff;
    border-color: var(--border);
  }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn.primary:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: #fff;
  }
  .btn.primary:focus-visible {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(37, 99, 235, 0.45);
  }
  .btn.danger {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .btn.danger:hover {
    background: var(--danger-hover);
    border-color: var(--danger-hover);
    color: #fff;
  }
  .btn.danger:focus-visible {
    box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(220, 38, 38, 0.45);
  }
  #btn-no, #btn-cancel { display: none; }
  /* Confirm: 确定/删除 + 取消（市面删除确认，不用「是/否」） */
  body.confirm #btn-cancel,
  body.ync #btn-no,
  body.ync #btn-cancel { display: inline-block; }
</style>
</head>
<body class="alert">
<div id="wrap">
  <div id="card" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="msg">
    <button id="close" type="button" aria-label="关闭">×</button>
    <div class="head">
      <div class="badge" id="badge" aria-hidden="true"></div>
      <div class="head-text">
        <h1 id="title">提示</h1>
        <p id="msg"></p>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="btn-cancel">取消</button>
      <button class="btn" id="btn-no">否</button>
      <button class="btn primary" id="btn-yes">确定</button>
    </div>
  </div>
</div>
<script>
  function post(msg) {
    try { chrome.webview.postMessage(JSON.stringify(msg)); } catch (e) {}
  }
  let mode = 'alert';
  function badgeSvg(tone) {
    // Compact Fluent-style glyphs (info / warn / danger).
    if (tone === 'danger' || tone === 'warn') {
      return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<path d="M12 8.2v5.2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
        '<circle cx="12" cy="16.4" r="1.15" fill="currentColor"/>' +
        '</svg>';
    }
    return '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<circle cx="12" cy="12" r="8.2" stroke="currentColor" stroke-width="2"/>' +
      '<path d="M12 10.6v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' +
      '<circle cx="12" cy="7.7" r="1.15" fill="currentColor"/>' +
      '</svg>';
  }
  window.applyState = function(m) {
    if (!m || m.type !== 'state') return;
    mode = m.mode || 'alert';
    const tone = m.tone || '';
    document.body.className = mode + (tone ? ' ' + tone : '');
    document.getElementById('badge').innerHTML = badgeSvg(tone);
    document.getElementById('title').textContent = m.title || '提示';
    document.getElementById('msg').textContent = m.message || '';
    const yes = document.getElementById('btn-yes');
    const no = document.getElementById('btn-no');
    const cancel = document.getElementById('btn-cancel');
    const danger = !!m.danger || tone === 'danger';
    if (m.yes_label) {
      yes.textContent = m.yes_label;
    } else if (mode === 'alert') {
      yes.textContent = '确定';
    } else if (danger) {
      yes.textContent = '删除';
    } else {
      yes.textContent = '确定';
    }
    no.textContent = m.no_label || '否';
    cancel.textContent = m.cancel_label || '取消';
    yes.className = 'btn ' + (danger ? 'danger' : 'primary');
    cancel.className = 'btn ghost';
    setTimeout(function () {
      (danger ? cancel : yes).focus();
    }, 40);
  };
  function finish(id) { post({ type: 'action', id: id }); }
  document.getElementById('btn-yes').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'yes');
  };
  document.getElementById('btn-no').onclick = function () { finish('no'); };
  document.getElementById('btn-cancel').onclick = function () { finish('cancel'); };
  document.getElementById('close').onclick = function () {
    finish(mode === 'alert' ? 'ok' : 'cancel');
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.getElementById('close').click();
    if (e.key === 'Enter') {
      const danger = document.body.classList.contains('danger');
      if (danger && mode === 'confirm') return; // Enter 不误删；需点红色按钮
      document.getElementById('btn-yes').click();
    }
  });
  try {
    chrome.webview.addEventListener('message', function (ev) {
      let m = ev.data;
      if (typeof m === 'string') {
        try { m = JSON.parse(m); } catch (e) { return; }
      }
      applyState(m);
    });
  } catch (e) {}
  post({ type: 'action', id: 'ready' });
</script>
</body>
</html>
