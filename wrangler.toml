# DeskTidy vault API — Cloudflare Worker + D1.
#
# The Pages/Workers build runs `npx wrangler deploy` with root directory "/",
# so this file is the deployment manifest: `main` is the Worker entry and
# `assets` serves the intro pages from docs/.
#
# Bindings that must exist in the dashboard (they are account-specific and
# cannot be committed):
#   DB             → D1 database holding the vault tables
#   VAULT_DATA_KEY → secret, base64 of 32 bytes (the AES key)
#
# One-time SQL:
#   wrangler d1 execute desktidy-vault --remote --file=server/d1/schema.sql
#   wrangler d1 execute desktidy-vault --remote --file=server/d1/seed.sql
#
# Deploy:
#   npx wrangler deploy

name = "desktidy-vault"
main = "src/vault_worker.ts"
compatibility_date = "2026-11-15"

# Intro pages. Kept so the same deployment answers both /api/* and /.
[assets]
directory = "docs"
binding = "ASSETS"

# Replace database_id with the value `wrangler d1 list` reports. The dashboard
# binding is what production actually uses; this block is for local runs.
# [[d1_databases]]
# binding = "DB"
# database_name = "desktidy-vault"
# database_id = "<your-d1-database-id>"
