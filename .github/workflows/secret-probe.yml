name: Secret Probe
on:
  push:
    paths:
      - '.github/workflows/secret-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check UPDATE_SIGNING_KEY_B64
        env:
          K: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$K" ]; then
            echo "::error::UPDATE_SIGNING_KEY_B64 未配置"
            exit 1
          fi
          echo "secret length: ${#K}"
          n=$(printf '%s' "$K" | base64 -d 2>/dev/null | wc -c)
          if [ "$n" -eq 32 ]; then
            echo "::notice::secret 有效（base64 解码后 32 字节）"
          else
            echo "::error::secret 解码得到 $n 字节（应为 32），请检查空格或截断"
            exit 1
          fi
