name: Secret Probe
on:
  push:
    paths:
      - ".github/workflows/secret-probe.yml"
  workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          K: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$K" ]; then
            echo "::error::UPDATE_SIGNING_KEY_B64 未配置"
            exit 1
          fi
          echo "secret length: ${#K}"
          # 校验能否解出 32 字节
          if echo "$K" | base64 -d 2>/dev/null | wc -c | grep -qx 32; then
            echo "::notice::secret 有效（base64 解码后 32 字节）"
          else
            echo "::error::secret 无法解码为 32 字节，请检查是否有多余空格或截断"
            exit 1
          fi
