name: Secret Probe
on:
  push:
    paths:
      - '.github/workflows/secret-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check UPDATE_SIGNING_KEY_B64
        env:
          K: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          # Do NOT rely on shell truthiness — write the evidence to the log
          # AND the step summary, and hard-fail when empty.
          LEN=${#K}
          echo "PROBE_LEN=$LEN"
          echo "### Secret probe" >> $GITHUB_STEP_SUMMARY
          echo "- length: $LEN" >> $GITHUB_STEP_SUMMARY
          if [ "$LEN" -eq 0 ]; then
            echo "- **EMPTY** — secret not configured" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "- value (first 6): ${K:0:6}..." >> $GITHUB_STEP_SUMMARY
          N=$(printf '%s' "$K" | base64 -d 2>/dev/null | wc -c || echo 0)
          echo "- decoded bytes: $N" >> $GITHUB_STEP_SUMMARY
          if [ "$N" -ne 32 ]; then
            echo "- **bad length**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "- OK" >> $GITHUB_STEP_SUMMARY
