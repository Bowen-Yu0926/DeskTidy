name: Build Check

# Compile-only verification. The Release workflow only runs on tags, so pushes
# to main were never compiled until release day — a typo could sit in the branch
# for days. This job builds the native targets on every push/PR and fails fast.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Visual Studio 2022 C++ toolchain
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $found = & $vsWhere -version '[17.0,18.0)' -products * -property installationPath
            if (-not [string]::IsNullOrWhiteSpace($found)) {
              Write-Host "Found VS2022: $found"
              exit 0
            }
          }
          Write-Host 'VS2022 not preinstalled - installing BuildTools with VC workload...'
          choco install visualstudio2022buildtools -y --no-progress `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VS2022 Build Tools' }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: cmd
        run: cmake -S native -B native/build -G "Visual Studio 17 2022" -A x64

      - name: Build native targets
        shell: pwsh
        run: |
          # Compile and capture output. On failure, publish the interesting
          # lines to the step summary (always visible) and as annotations.
          # Job logs need admin rights via the API, so this is the only way to
          # see the actual compiler message.
          cmake --build native/build --config Release --target desktidy_native 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $all = Get-Content build.log
            $errors = $all | Where-Object { $_ -match ': error |error LNK|error C[0-9]|error MSB' } |
              Select-Object -First 25
            $report = if ($errors) { $errors } else { $all | Select-Object -Last 40 }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Build failed" -Encoding utf8
            foreach ($l in $report) {
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("``" + $l + "``") -Encoding utf8
              Write-Output "::error::$l"
            }
            exit 1
          }
          cmake --build native/build --config Release --target deskNote
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## deskNote build failed" -Encoding utf8
            exit 1
          }

      - name: Publish build log
        if: always()
        shell: pwsh
        run: |
          # artifact downloads require an authenticated token; pushing the log
          # to a throwaway branch is readable over plain SSH and needs no PAT.
          if (-not (Test-Path build.log)) { exit 0 }
          git config user.email "ci@desktidy.local"
          git config user.name "build-check"
          git checkout --orphan ci-log 2>$null
          git rm -rf --cached . 2>$null | Out-Null
          Copy-Item build.log build-check.log -Force
          git add -f build-check.log
          git commit -m "build log for ${{ github.sha }}" --no-verify
          git push -f origin ci-log

      - name: Run update-signature test
        shell: pwsh
        run: |
          cmake --build native/build --config Release --target test_update_verify
          if ($LASTEXITCODE -ne 0) { throw 'test_update_verify build failed' }
          $exe = Get-ChildItem -Recurse -Filter test_update_verify.exe native/build | Select-Object -First 1
          if (-not $exe) { throw 'test_update_verify.exe not found' }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'test_update_verify FAILED' }
