name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (optional)'
        required: false
        default: ''
      bump_patch:
        description: 'Automatically bump patch version (4.0.51 -> 4.0.52) before building'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-release:
    # Use the Windows Server 2022 image: it ships with VS2022, which matches
    # the fixed "Visual Studio 17 2022" CMake generator in native/build.bat.
    # windows-latest currently maps to a VS2026-only image where CMake cannot
    # find the VS2022 generator.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release version
        shell: pwsh
        run: |
          $manual = "${{ github.event_name }}" -eq "workflow_dispatch"
          $bump = "${{ github.event.inputs.bump_patch }}" -eq "true"
          if ($manual -and $bump) {
            python scripts/bump_version.py --bump
            if ($LASTEXITCODE -ne 0) { throw 'bump_version.py failed' }
          }

          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must look like 4.0.51, got: $version"
          }

          if (-not $manual) {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Tag must look like v4.0.51, got: $tag"
            }
            $tagVersion = $Matches[1]
            if ($tagVersion -ne $version) {
              Write-Host "Tag $tag specifies version $tagVersion, but repo VERSION is $version. Auto-syncing..."
              python scripts/bump_version.py --version $tagVersion
              if ($LASTEXITCODE -ne 0) { throw 'bump_version.py failed' }
              $version = $tagVersion
            }
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release version: $version"

      - name: Sync docs download link to release version
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $version = $env:RELEASE_VERSION
          python -c "import sys; sys.path.insert(0,'scripts'); import release; release.update_download_links('$version', dry_run=False)"
          if ($LASTEXITCODE -ne 0) { throw 'docs download-link sync failed' }
          Write-Host "docs/desktidy.html now points at v$version"

      - name: Prepare Visual Studio 2022 C++ toolchain
        shell: pwsh
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vsWhere) {
            $found = & $vsWhere -version '[17.0,18.0)' -products * -property installationPath
            if (-not [string]::IsNullOrWhiteSpace($found)) {
              Write-Host "Found VS2022: $found"
              exit 0
            }
          }
          Write-Host 'VS2022 not preinstalled - installing BuildTools with VC workload...'
          choco install visualstudio2022buildtools -y --no-progress `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install VS2022 Build Tools' }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 compiler not found after install' }
          Write-Host "ISCC=$iscc"

      - name: Build installer
        shell: cmd
        run: scripts\build_native_installer.bat --release-only

      - name: Verify update-signature module
        shell: pwsh
        run: |
          # Ed25519 verify is a security boundary — fail the release, not the
          # user's updater, if the vendored TweetNaCl or glue is broken.
          cmake --build build --config Release --target test_update_verify
          if ($LASTEXITCODE -ne 0) { throw 'test_update_verify build failed' }
          $exe = Get-ChildItem -Recurse -Filter test_update_verify.exe build | Select-Object -First 1
          if (-not $exe) { throw 'test_update_verify.exe not found' }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw 'test_update_verify FAILED' }

      - name: Sign installer manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.UPDATE_SIGNING_KEY_B64 }}
        run: |
          $version = $env:RELEASE_VERSION
          $setup = "dist\DeskTidy_Setup_$version.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }

          # Does the build itself require a signature? If a public key is
          # embedded, the client REFUSES unsigned updates — so releasing
          # without one would brick auto-update for every user on that build.
          $verifySrc = "native/src/update_verify.cpp"
          $hasKey = -not (Select-String -Path $verifySrc -Pattern 'kBuiltinSigningKeyB64 = "\s*"' -Quiet)

          if (-not $env:UPDATE_SIGNING_KEY_B64) {
            if ($hasKey) {
              throw ('Build has an embedded update-signing public key but ' +
                     'UPDATE_SIGNING_KEY_B64 is not set. Clients would refuse ' +
                     'this release''s updates. Add the secret, or clear the key.')
            }
            # Rollout window: no key embedded, no signing. Client skips the
            # signature check with a loud log and still enforces sha256.
            Write-Warning 'UPDATE_SIGNING_KEY_B64 not set — releasing WITHOUT update signature'
            exit 0
          }
          if (-not $hasKey) {
            throw ('UPDATE_SIGNING_KEY_B64 is set but the build has no embedded ' +
                   'public key (native/src/update_verify.cpp). Shipping .sig ' +
                   'files clients cannot check. Embed the key first.')
          }

          $keyFile = Join-Path $env:RUNNER_TEMP 'update_signing.key'
          [IO.File]::WriteAllBytes($keyFile, [Convert]::FromBase64String($env:UPDATE_SIGNING_KEY_B64))
          try {
            python scripts/update_signing.py sign $setup --version $version --key $keyFile
            if ($LASTEXITCODE -ne 0) { throw 'update_signing.py sign failed' }
            if (-not (Test-Path "$setup.manifest") -or -not (Test-Path "$setup.sig")) {
              throw 'manifest/.sig missing after signing'
            }
            python scripts/update_signing.py verify "$setup.manifest" "$setup.sig" --key $keyFile
            if ($LASTEXITCODE -ne 0) { throw 'signature self-check failed' }
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }
          Write-Host "signed: $setup.manifest"

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $setup = "dist\DeskTidy_Setup_$version.exe"
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          Write-Host "setup=$setup size=$((Get-Item $setup).Length) sha256=$hash"
          "$hash  DeskTidy_Setup_$version.exe" | Set-Content -Path "$setup.sha256" -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'GH_TOKEN secret is required' }
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $notes = "${{ github.event.inputs.notes }}"
          if (-not $notes) { $notes = "DeskTidy $version" }
          $assets = @("dist\DeskTidy_Setup_$version.exe", "dist\DeskTidy_Setup_$version.exe.sha256")
          # Attach the signature sidecars only when signing actually ran.
          $man = "dist\DeskTidy_Setup_$version.exe.manifest"
          $sig = "dist\DeskTidy_Setup_$version.exe.sig"
          if ((Test-Path $man) -and (Test-Path $sig)) {
            $assets += $man
            $assets += $sig
          }
          $repo = "Bowen-Yu0926/DeskTidy"
          $existing = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $repo --clobber
            gh release edit $tag --repo $repo --title "DeskTidy $version" --notes $notes
          } else {
            gh release create $tag @assets --repo $repo --title "DeskTidy $version" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed' }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskTidy-installer
          path: |
            dist/DeskTidy_Setup_*.exe
            dist/DeskTidy_Setup_*.exe.sha256
            dist/DeskTidy_Setup_*.exe.manifest
            dist/DeskTidy_Setup_*.exe.sig
          retention-days: 14
